<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer Fund — Login & Register</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A3C2A">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell" style="padding-bottom: 28px;">
    <header class="hero-header" style="padding-bottom: 34px;">
      <div class="header-top">
        <div class="brand-row">
          <div class="brand-logo">PF</div>
          <div>
            <div class="greeting-name" data-i18n="appName">Peer Fund</div>
            <div class="greeting-small" data-i18n="tagline">Emergency Mutual Fund</div>
          </div>
        </div>
        <button class="lang-btn" id="lang-toggle">বাংলা</button>
      </div>
      <h1 style="font-size:22px;font-weight:800;margin-top:6px;" id="auth-heading">Welcome Back</h1>
      <p style="font-size:13px;opacity:.82;margin-top:4px;" id="auth-sub">Secure bilingual mutual fund portal for friends</p>
    </header>

    <main class="content" style="margin-top:-18px;position:relative;z-index:2;">
      <!-- Auth Card -->
      <div class="card" id="auth-card">
        <div class="tabs">
          <button class="tab-btn active" id="tab-login" data-i18n="login">Login</button>
          <button class="tab-btn" id="tab-register" data-i18n="register">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" data-i18n="emailOrPhone">Email ID or 10-Digit Mobile</label>
            <input type="text" class="input" id="login-id" required placeholder="example@gmail.com or 9832420007">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="password">Password</label>
            <div class="pw-wrap">
              <input type="password" class="input" id="login-pw" required placeholder="••••••">
              <button type="button" class="pw-toggle" data-target="login-pw">Show</button>
            </div>
          </div>
          <div style="text-align:right;margin-bottom:14px;">
            <button type="button" id="open-forgot" style="background:none;border:none;color:var(--emerald);font-weight:700;font-size:12px;cursor:pointer;" data-i18n="forgotPw">Forgot Password?</button>
          </div>
          <button type="submit" class="btn btn-mint btn-full" id="login-btn" data-i18n="login">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden">
          <div class="form-group">
            <label class="form-label" data-i18n="fullName">Full Name</label>
            <input type="text" class="input" id="reg-name" required placeholder="Dhananjoy Karmakar">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="email">Email ID</label>
            <input type="email" class="input" id="reg-email" required placeholder="name@gmail.com">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="phone">10-Digit Mobile Number</label>
            <input type="tel" class="input" id="reg-phone" required maxlength="10" pattern="[0-9]{10}" placeholder="9832420007">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="password">Password</label>
            <div class="pw-wrap">
              <input type="password" class="input" id="reg-pw" required minlength="6" placeholder="Min 6 characters">
              <button type="button" class="pw-toggle" data-target="reg-pw">Show</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="confirmPassword">Retype Password</label>
            <div class="pw-wrap">
              <input type="password" class="input" id="reg-pw2" required minlength="6" placeholder="Confirm password">
              <button type="button" class="pw-toggle" data-target="reg-pw2">Show</button>
            </div>
          </div>
          <button type="submit" class="btn btn-mint btn-full" id="reg-btn" data-i18n="register">Register</button>
        </form>
      </div>

      <!-- Pending Admin Approval Card -->
      <div class="card hidden" id="pending-card" style="text-align:center;padding:28px 20px;">
        <div style="font-size:44px;margin-bottom:10px;">⏳</div>
        <h2 style="font-size:19px;margin-bottom:8px;" data-i18n="pendingApprovalTitle">Pending Admin Approval</h2>
        <p style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:20px;" data-i18n="pendingApprovalMsg">
          Your account has been created and is waiting for Admin approval.
        </p>
        <div id="pending-user-info" style="background:var(--mint-soft);padding:12px;border-radius:14px;font-size:13px;margin-bottom:18px;"></div>
        <button class="btn btn-dark btn-full" id="pending-logout" data-i18n="logout">Logout</button>
      </div>
    </main>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-backdrop" id="forgot-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 data-i18n="resetPw">Reset Password</h3>
        <button class="modal-close" id="close-forgot">✕</button>
      </div>
      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" data-i18n="emailOrPhone">Email ID or 10-Digit Mobile</label>
          <input type="text" class="input" id="forgot-id" required placeholder="Registered email or mobile">
        </div>
        <button type="submit" class="btn btn-mint btn-full" data-i18n="sendReset">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script type="module">
    import {
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      sendPasswordResetEmail, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc, getDoc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      auth, db, ADMIN_EMAIL, ADMIN_PHONE, toggleLang, applyTranslations, getLang, showToast, writeAuditLog
    } from "./js/app.js";

    applyTranslations();
    document.getElementById("lang-toggle").addEventListener("click", toggleLang);

    // Password show/hide toggles
    document.querySelectorAll(".pw-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const inp = document.getElementById(btn.dataset.target);
        inp.type = inp.type === "password" ? "text" : "password";
        btn.textContent = inp.type === "password" ? "Show" : "Hide";
      });
    });

    // Tabs
    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const regForm = document.getElementById("register-form");

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active"); tabReg.classList.remove("active");
      loginForm.classList.remove("hidden"); regForm.classList.add("hidden");
    });
    tabReg.addEventListener("click", () => {
      tabReg.classList.add("active"); tabLogin.classList.remove("active");
      regForm.classList.remove("hidden"); loginForm.classList.add("hidden");
    });

    // Helper: Resolve email from Email or 10-Digit Phone
    async function resolveEmail(identifier) {
      const clean = identifier.trim();
      if (/^[0-9]{10}$/.test(clean)) {
        const snap = await getDoc(doc(db, "phone_lookup", clean));
        if (!snap.exists()) {
          throw new Error(getLang() === "bn" ? "এই মোবাইল নম্বরে কোনো অ্যাকাউন্ট পাওয়া যায়নি" : "No account found with this mobile number");
        }
        return snap.data().email;
      }
      return clean.toLowerCase();
    }

    // Login Submit
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      try {
        const email = await resolveEmail(document.getElementById("login-id").value);
        const pw = document.getElementById("login-pw").value;
        await signInWithEmailAndPassword(auth, email, pw);
      } catch (err) {
        let msg = err.message;
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") {
          msg = getLang() === "bn" ? "ইমেইল/ফোন বা পাসওয়ার্ড ভুল হয়েছে" : "Invalid email/phone or password";
        }
        showToast(msg, 4000);
      } finally {
        btn.disabled = false;
      }
    });

    // Register Submit (Strict Unique Email & Phone + Auto-Admin Check)
    regForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("reg-btn");
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim().toLowerCase();
      const phone = document.getElementById("reg-phone").value.trim();
      const pw = document.getElementById("reg-pw").value;
      const pw2 = document.getElementById("reg-pw2").value;

      if (!/^[0-9]{10}$/.test(phone)) {
        showToast(getLang() === "bn" ? "সঠিক ১০ সংখ্যার মোবাইল নম্বর দিন" : "Enter a valid 10-digit mobile number");
        return;
      }
      if (pw !== pw2) {
        showToast(getLang() === "bn" ? "দুটি পাসওয়ার্ড মেলেনি!" : "Passwords do not match!");
        return;
      }

      btn.disabled = true;
      try {
        // 1. Check strict phone uniqueness BEFORE creating Auth account
        const phoneRef = doc(db, "phone_lookup", phone);
        const phoneSnap = await getDoc(phoneRef);
        if (phoneSnap.exists()) {
          showToast(getLang() === "bn" ? "এই মোবাইল নম্বর দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে" : "This mobile number is already registered", 4000);
          btn.disabled = false;
          return;
        }

        // 2. Create Firebase Auth user (enforces unique email)
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        const uid = cred.user.uid;

        // 3. Strict Auto-Admin check (BOTH exact email AND exact phone)
        const isAutoAdmin = (email === ADMIN_EMAIL.toLowerCase() && phone === ADMIN_PHONE);
        const role = isAutoAdmin ? "admin" : "member";
        const approvalStatus = isAutoAdmin ? "approved" : "pending";
        const memberId = "PF-" + phone.slice(-4);

        // 4. Write phone_lookup & users/{uid}
        await setDoc(phoneRef, { email, uid, createdAt: serverTimestamp() });
        await setDoc(doc(db, "users", uid), {
          name, email, phone, role, approvalStatus, memberId,
          totalPaid: 0, pendingFine: 0, paidMonths: [],
          bloodGroup: "", upiId: "", emergencyContact: "",
          bankAccount: "", ifsc: "", nominee: "", photoBase64: "",
          createdAt: serverTimestamp()
        });

        await writeAuditLog({ uid, name, role }, "USER_REGISTERED",
          `${name} (${phone}) registered as ${role} (${approvalStatus}).`,
          `${name} (${phone}) ${role} হিসেবে রেজিস্ট্রেশন করেছেন।`
        );

        showToast(getLang() === "bn" ? "রেজিস্ট্রেশন সফল হয়েছে!" : "Registration successful!");
      } catch (err) {
        let msg = err.message;
        if (err.code === "auth/email-already-in-use") {
          msg = getLang() === "bn" ? "এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে" : "This email is already registered";
        }
        showToast(msg, 4000);
      } finally {
        btn.disabled = false;
      }
    });

    // Forgot Password Modal
    const forgotModal = document.getElementById("forgot-modal");
    document.getElementById("open-forgot").addEventListener("click", () => forgotModal.classList.add("open"));
    document.getElementById("close-forgot").addEventListener("click", () => forgotModal.classList.remove("open"));
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const email = await resolveEmail(document.getElementById("forgot-id").value);
        await sendPasswordResetEmail(auth, email);
        forgotModal.classList.remove("open");
        showToast(getLang() === "bn"
          ? "আপনার রেজিস্টার্ড ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে (Spam ফোল্ডারও দেখুন)"
          : "Password reset link sent to your registered email (check Spam folder too)", 5000);
      } catch (err) {
        showToast(err.message, 4000);
      }
    });

    document.getElementById("pending-logout").addEventListener("click", () => signOut(auth));

    // Auth State Router
    onAuthStateChanged(auth, async (fbUser) => {
      const authCard = document.getElementById("auth-card");
      const pendingCard = document.getElementById("pending-card");
      if (!fbUser) {
        authCard.classList.remove("hidden");
        pendingCard.classList.add("hidden");
        return;
      }
      const snap = await getDoc(doc(db, "users", fbUser.uid));
      if (!snap.exists()) return;
      const u = snap.data();
      if (u.approvalStatus === "approved") {
        window.location.href = "dashboard.html";
      } else {
        authCard.classList.add("hidden");
        pendingCard.classList.remove("hidden");
        document.getElementById("pending-user-info").innerHTML =
          `<strong>${u.name}</strong><br>${u.email} • ${u.phone}`;
      }
    });
  </script>
</body>
</html>
