<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immutable Audit Log - Peer Fund</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0A3C2A" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="pb-32">
  <header class="fintech-gradient text-white p-4 shadow-lg sticky top-0 z-30">
    <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
      <div class="min-w-0 flex-1">
        <h1 class="font-extrabold text-base sm:text-lg flex items-center gap-2 truncate">
          <span>🔒</span><span class="truncate" data-i18n="auditLogTitle">অপরিবর্তনীয় অডিট লগ</span>
        </h1>
        <p class="text-[11px] text-[#5CDDAB] truncate" data-i18n="auditLogSub">
          প্রতিটি জমা, বিয়োগ, রিমার্কস, Undo ও রোল পরিবর্তনের স্থায়ী রেকর্ড — কেউ ডিলিট করতে পারবেন না।
        </p>
      </div>
      <button class="lang-toggle-btn px-3 py-1.5 rounded-xl bg-white/15 text-xs font-bold shrink-0 whitespace-nowrap">
        <span class="lang-indicator">English</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-5">
    <div id="audit-feed" class="space-y-3">
      <p class="text-xs text-gray-500 text-center py-8">...</p>
    </div>
  </main>

  <!-- Floating Undo / Redo Bar -->
  <div id="undo-redo-bar" class="hidden fixed bottom-20 left-3 right-3 max-w-md mx-auto bg-slate-900/95 text-white rounded-2xl px-3.5 py-2 shadow-xl border border-white/15 z-40 flex items-center justify-between gap-2">
    <span id="undo-redo-label" class="text-[11px] text-emerald-200 truncate flex-1">Action recorded</span>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="global-undo-btn" class="px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1">
        ↩️ <span data-i18n="undoBtn">Undo</span>
      </button>
      <button id="global-redo-btn" class="px-2.5 py-1 rounded-lg bg-emerald-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1">
        ↪️ <span data-i18n="redoBtn">Redo</span>
      </button>
    </div>
  </div>

  <!-- 5-Tab High-Contrast SVG Bottom Navigation Bar -->
  <nav id="bottom-nav" class="fixed bottom-3 left-2.5 right-2.5 max-w-lg mx-auto bottom-nav-pill text-white rounded-2xl px-1.5 py-2 z-40 border border-white/15">
    <div class="grid grid-cols-5 gap-0.5 text-center text-[10px] sm:text-[11px] leading-none">
      <a href="dashboard.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navHome">হোম</span>
      </a>
      <a href="ledger.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 7h6m-6 4h4"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLedger">হিসাব</span>
      </a>
      <a href="loans.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLoans">লোন</span>
      </a>
      <a href="profile.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navProfile">প্রোফাইল</span>
      </a>
      <a href="settings.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navSettings">সেটিংস</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { requireApprovedUser, setupCommonUI } from "./js/utils.js";
    import { getLang } from "./js/i18n.js";

    setupCommonUI();

    requireApprovedUser(() => {
      let logs = [];
      onSnapshot(query(collection(db, "audit_logs"), orderBy("createdAt", "desc")), (snap) => {
        logs = [];
        snap.forEach((d) => logs.push({ id: d.id, ...d.data() }));
        renderLogs();
      });

      function renderLogs() {
        const feed = document.getElementById("audit-feed");
        const lang = getLang();
        if (logs.length === 0) {
          feed.innerHTML = `<div class="fintech-card p-6 text-center text-xs text-gray-500">${lang === "bn" ? "কোনো অডিট রেকর্ড নেই।" : "No audit records yet."}</div>`;
          return;
        }
        feed.innerHTML = logs.map((l) => {
          const msg = lang === "bn" ? (l.messageBn || l.messageEn) : (l.messageEn || l.messageBn);
          const timeStr = l.timestampIso ? new Date(l.timestampIso).toLocaleString("en-IN") : "";
          return `
            <div class="fintech-card p-4 border-l-4 border-[#39D59E]">
              <div class="flex justify-between items-center mb-1">
                <span class="px-2 py-0.5 rounded bg-emerald-100 text-[#0A3C2A] text-[10px] font-extrabold">${l.actionType || "LOG"}</span>
                <span class="text-[11px] text-gray-400">🔒 ${timeStr}</span>
              </div>
              <p class="text-xs md:text-sm font-semibold text-gray-800">${msg}</p>
              ${l.remark ? `<p class="text-xs text-amber-800 bg-amber-50 px-2.5 py-1 rounded-lg mt-1.5 font-medium">Remark: ${l.remark}</p>` : ""}
              <p class="text-[11px] text-gray-500 mt-1">Actor: ${l.actorName || "System"} (${(l.actorRole || "").toUpperCase()})</p>
            </div>
          `;
        }).join("");
      }

      window.addEventListener("languageChanged", renderLogs);
    });
  </script>
</body>
</html>
