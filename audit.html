<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log - Peer Fund</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0A3C2A" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="pb-32">
  <header class="fintech-gradient text-white p-4 shadow-lg sticky top-0 z-30">
    <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
      <div class="min-w-0 flex-1">
        <h1 class="font-extrabold text-base sm:text-lg flex items-center gap-2 truncate">
          <span>🔒</span><span class="truncate" data-i18n="auditLogTitle">Audit Log & History</span>
        </h1>
        <p class="text-[11px] text-[#5CDDAB] truncate" data-i18n="auditLogSub">
          Complete record of every deposit, deduction, remark, Undo & role change (Admin can delete unnecessary records).
        </p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button class="notif-bell-btn relative p-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white transition shrink-0" title="Notifications">
          <svg class="w-4 h-4 text-[#5CDDAB]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="notif-badge hidden absolute -top-1 -right-1 px-1 min-w-[16px] h-4 rounded-full bg-red-600 text-white text-[9px] font-extrabold flex items-center justify-center">0</span>
        </button>
        <button class="lang-toggle-btn px-3 py-1.5 rounded-xl bg-white/15 text-xs font-bold shrink-0 whitespace-nowrap">
          <span class="lang-indicator">বাংলা</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-5 space-y-3">
    <!-- Admin Multi-Select & Select All Toolbar -->
    <div id="audit-bulk-bar" class="hidden fintech-card p-3.5 flex flex-wrap items-center justify-between gap-2 border-l-4 border-red-600 sticky top-20 z-20">
      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input type="checkbox" id="audit-select-all-chk" class="w-4 h-4 accent-red-600 rounded cursor-pointer" />
        <span class="text-xs sm:text-sm font-extrabold text-[#0A3C2A]" data-i18n="selectAllLabel">Select All</span>
        <span id="audit-selected-badge" class="px-2 py-0.5 rounded-full bg-emerald-100 text-[#0A3C2A] text-[11px] font-extrabold">0</span>
      </label>

      <button id="audit-delete-selected-btn" disabled
        class="px-3.5 py-2 rounded-xl bg-red-600 disabled:opacity-40 text-white text-xs font-extrabold flex items-center gap-1.5 shadow transition">
        <span>🗑️</span>
        <span data-i18n="deleteSelectedBtn">Delete Selected</span>
        <span id="audit-del-count">(0)</span>
      </button>
    </div>

    <div id="audit-feed" class="space-y-3">
      <p class="text-xs text-gray-500 text-center py-8">Loading audit logs...</p>
    </div>
  </main>

  <!-- Floating Undo / Redo Bar -->
  <div id="undo-redo-bar" class="hidden fixed bottom-20 left-3 right-3 max-w-md mx-auto bg-slate-900/95 text-white rounded-2xl px-3.5 py-2 shadow-xl border border-white/15 z-40 flex items-center justify-between gap-2">
    <span id="undo-redo-label" class="text-[11px] text-emerald-200 truncate flex-1">Action recorded</span>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="global-undo-btn" class="px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1">
        ↩️ <span data-i18n="undoBtn">Undo</span>
      </button>
      <button id="global-redo-btn" class="px-2.5 py-1 rounded-lg bg-emerald-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1">
        ↪️ <span data-i18n="redoBtn">Redo</span>
      </button>
    </div>
  </div>

  <!-- 5-Tab High-Contrast SVG Bottom Navigation Bar -->
  <nav id="bottom-nav" class="fixed bottom-3 left-2.5 right-2.5 max-w-lg mx-auto bottom-nav-pill text-white rounded-2xl px-1.5 py-2 z-40 border border-white/15">
    <div class="grid grid-cols-5 gap-0.5 text-center text-[10px] sm:text-[11px] leading-none">
      <a href="dashboard.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navHome">Home</span>
      </a>
      <a href="ledger.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 7h6m-6 4h4"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLedger">Ledger</span>
      </a>
      <a href="loans.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLoans">Loans</span>
      </a>
      <a href="profile.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navProfile">Profile</span>
      </a>
      <a href="settings.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navSettings">Settings</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, doc, deleteDoc, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { requireApprovedUser, setupCommonUI, getRoleBadgeClasses, askForRemarks, showFintechPopup } from "./js/utils.js";
    import { getLang } from "./js/i18n.js";

    setupCommonUI();

    requireApprovedUser((user, me) => {
      const isAdmin = me.role === "admin";
      let logs = [];
      const selectedIds = new Set();

      const bulkBar = document.getElementById("audit-bulk-bar");
      const selectAllChk = document.getElementById("audit-select-all-chk");
      const selectedBadge = document.getElementById("audit-selected-badge");
      const delSelectedBtn = document.getElementById("audit-delete-selected-btn");
      const delCountSpan = document.getElementById("audit-del-count");

      function updateSelectionUI() {
        if (!isAdmin) return;
        // Prune IDs that no longer exist
        const validIds = new Set(logs.map((x) => x.id));
        for (const id of Array.from(selectedIds)) {
          if (!validIds.has(id)) selectedIds.delete(id);
        }

        const count = selectedIds.size;
        selectedBadge.textContent = String(count);
        delCountSpan.textContent = `(${count})`;
        delSelectedBtn.disabled = count === 0;
        selectAllChk.checked = logs.length > 0 && count === logs.length;
        selectAllChk.indeterminate = count > 0 && count < logs.length;
      }

      if (isAdmin) {
        selectAllChk.addEventListener("change", () => {
          if (selectAllChk.checked) {
            logs.forEach((l) => selectedIds.add(l.id));
          } else {
            selectedIds.clear();
          }
          document.querySelectorAll(".audit-row-chk").forEach((cb) => {
            cb.checked = selectedIds.has(cb.dataset.lid);
          });
          updateSelectionUI();
        });

        delSelectedBtn.addEventListener("click", async () => {
          const idsToDelete = Array.from(selectedIds);
          if (idsToDelete.length === 0) return;

          const remark = await askForRemarks({
            titleBn: `নির্বাচিত ${idsToDelete.length}টি রেকর্ড ডিলিট করার কারণ`,
            titleEn: `Delete ${idsToDelete.length} Selected Records`,
            required: false
          });
          if (remark === null) return;

          delSelectedBtn.disabled = true;
          try {
            // Firestore writeBatch supports up to 500 ops per batch
            for (let i = 0; i < idsToDelete.length; i += 450) {
              const chunk = idsToDelete.slice(i, i + 450);
              const batch = writeBatch(db);
              chunk.forEach((id) => batch.delete(doc(db, "audit_logs", id)));
              await batch.commit();
            }
            selectedIds.clear();
            updateSelectionUI();
            showFintechPopup({
              type: "info",
              titleBn: `${idsToDelete.length}টি রেকর্ড ডিলিট হয়েছে!`,
              titleEn: `${idsToDelete.length} Records Deleted!`,
              msgBn: "নির্বাচিত অডিট লগ রেকর্ডগুলো সফলভাবে মুছে ফেলা হয়েছে।",
              msgEn: "All selected audit log records have been permanently deleted."
            });
          } catch (err) {
            showFintechPopup({
              type: "error",
              titleBn: "ডিলিট ত্রুটি",
              titleEn: "Delete Error",
              msgBn: err.message,
              msgEn: err.message
            });
          }
        });
      }

      onSnapshot(
        collection(db, "audit_logs"),
        (snap) => {
          logs = [];
          snap.forEach((d) => logs.push({ id: d.id, ...d.data() }));
          logs.sort((a, b) => {
            const ta = a.timestampIso || (a.createdAt?.toDate ? a.createdAt.toDate().toISOString() : "");
            const tb = b.timestampIso || (b.createdAt?.toDate ? b.createdAt.toDate().toISOString() : "");
            return tb.localeCompare(ta);
          });
          if (isAdmin) {
            bulkBar.classList.toggle("hidden", logs.length === 0);
          }
          renderLogs();
          updateSelectionUI();
        },
        (err) => {
          const feed = document.getElementById("audit-feed");
          feed.innerHTML = `<div class="fintech-card p-6 text-center text-xs text-red-600 font-bold">Error loading audit logs: ${err.message}</div>`;
        }
      );

      function renderLogs() {
        const feed = document.getElementById("audit-feed");
        const lang = getLang();
        if (logs.length === 0) {
          feed.innerHTML = `<div class="fintech-card p-6 text-center text-xs text-gray-500">${lang === "bn" ? "কোনো অডিট রেকর্ড নেই।" : "No audit records yet."}</div>`;
          return;
        }
        feed.innerHTML = logs.map((l) => {
          const msg = lang === "bn" ? (l.messageBn || l.messageEn) : (l.messageEn || l.messageBn);
          const timeStr = l.timestampIso
            ? new Date(l.timestampIso).toLocaleString("en-IN")
            : (l.createdAt?.toDate ? l.createdAt.toDate().toLocaleString("en-IN") : "");
          const roleText = (l.actorRole || "system") === "co_admin" ? "CO-ADMIN" : (l.actorRole || "system").toUpperCase();
          const isChecked = selectedIds.has(l.id);
          return `
            <div class="fintech-card p-4 border-l-4 border-[#39D59E] flex items-start gap-3">
              ${isAdmin ? `
                <input type="checkbox" data-lid="${l.id}" ${isChecked ? "checked" : ""}
                  class="audit-row-chk mt-1 w-4 h-4 accent-red-600 rounded shrink-0 cursor-pointer" />
              ` : ""}
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center gap-2 mb-1">
                  <span class="px-2 py-0.5 rounded bg-emerald-100 text-[#0A3C2A] text-[10px] font-extrabold">${l.actionType || "LOG"}</span>
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] text-gray-400">🔒 ${timeStr}</span>
                    ${isAdmin ? `<button data-lid="${l.id}" class="del-audit-btn px-2 py-0.5 rounded bg-red-100 text-red-700 text-[10px] font-bold" title="Delete">🗑️</button>` : ""}
                  </div>
                </div>
                <p class="text-xs md:text-sm font-semibold text-gray-800 break-words">${msg || "-"}</p>
                ${l.remark ? `<p class="text-xs text-amber-800 bg-amber-50 px-2.5 py-1 rounded-lg mt-1.5 font-medium">Remark: ${l.remark}</p>` : ""}
                <p class="text-[11px] text-gray-500 mt-1">Actor: <strong>${l.actorName || "System"}</strong> <span class="ml-1 px-1.5 py-0.5 rounded text-[9px] font-extrabold uppercase ${getRoleBadgeClasses(l.actorRole)}">${roleText}</span></p>
              </div>
            </div>
          `;
        }).join("");

        feed.querySelectorAll(".audit-row-chk").forEach((cb) => {
          cb.addEventListener("change", () => {
            if (cb.checked) selectedIds.add(cb.dataset.lid);
            else selectedIds.delete(cb.dataset.lid);
            updateSelectionUI();
          });
        });

        feed.querySelectorAll(".del-audit-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const ok = await askForRemarks({
              titleBn: "এই রেকর্ডটি ডিলিট করার কারণ লিখুন",
              titleEn: "Reason for deleting this record",
              required: false
            });
            if (ok === null) return;
            selectedIds.delete(btn.dataset.lid);
            await deleteDoc(doc(db, "audit_logs", btn.dataset.lid));
            showFintechPopup({
              type: "info",
              titleBn: "রেকর্ড ডিলিট হয়েছে",
              titleEn: "Record Deleted",
              msgBn: "নির্বাচিত রেকর্ডটি মুছে ফেলা হয়েছে।",
              msgEn: "The selected record has been deleted."
            });
          });
        });
      }

      window.addEventListener("languageChanged", renderLogs);
    });
  </script>
</body>
</html>
