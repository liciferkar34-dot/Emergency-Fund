<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Loans - Peer Fund</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0A3C2A" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="pb-32">
  <header class="fintech-gradient text-white p-4 shadow-lg sticky top-0 z-30">
    <div class="max-w-5xl mx-auto flex justify-between items-center gap-2">
      <div class="min-w-0 flex-1">
        <h1 class="font-extrabold text-base sm:text-lg truncate" data-i18n="emergencyLoans">ইমার্জেন্সি লোন ও পিয়ার ভোটিং</h1>
        <p class="text-[11px] text-[#5CDDAB] truncate" data-i18n="loansSub">০% সুদ • ₹০ প্রসেসিং ফি • আগে আবেদন করলে প্রথম অগ্রাধিকার</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button class="notif-bell-btn relative p-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white transition shrink-0" title="Notifications">
            <svg class="w-4 h-4 text-[#5CDDAB]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="notif-badge hidden absolute -top-1 -right-1 px-1 min-w-[16px] h-4 rounded-full bg-red-600 text-white text-[9px] font-extrabold flex items-center justify-center">0</span>
          </button>
        <button class="lang-toggle-btn px-3 py-1.5 rounded-xl bg-white/15 text-xs font-bold whitespace-nowrap">
          <span class="lang-indicator">English</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-5 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-5">
      <div class="fintech-card p-5">
        <h2 class="font-extrabold text-base text-[#0A3C2A] mb-3" data-i18n="applyLoanTitle">নতুন ইমার্জেন্সি লোনের আবেদন (০% সুদ)</h2>

        <div class="grid grid-cols-3 gap-2 mb-4 text-center">
          <div class="p-2 rounded-xl bg-emerald-50 border border-emerald-100">
            <p class="text-[10px] text-gray-500">Interest</p>
            <p class="font-extrabold text-xs text-emerald-800" data-i18n="interestBadge">০% সুদ</p>
          </div>
          <div class="p-2 rounded-xl bg-emerald-50 border border-emerald-100">
            <p class="text-[10px] text-gray-500">Fee</p>
            <p class="font-extrabold text-xs text-emerald-800" data-i18n="feeBadge">₹০ ফি</p>
          </div>
          <div class="p-2 rounded-xl bg-emerald-50 border border-emerald-100">
            <p class="text-[10px] text-gray-500" data-i18n="maxLimitBadge">সর্বোচ্চ সীমা</p>
            <p class="font-extrabold text-xs text-emerald-800" id="max-loan-badge">₹35,000</p>
          </div>
        </div>

        <form id="loan-apply-form" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="loanAmountLabel">টাকার পরিমাণ *</label>
            <input type="number" id="loan-amount" required min="500" max="35000" placeholder="25000"
              class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0A3C2A]" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="loanReasonLabel">ইমার্জেন্সির বিস্তারিত কারণ *</label>
            <textarea id="loan-reason" required rows="3" data-i18n-placeholder="loanReasonPh"
              class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#0A3C2A]"></textarea>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="loanProofLabel">
              বাধ্যতামূলক প্রমাণ আপলোড (হাসপাতালের বিল / প্রেসক্রিপশন ছবি বা PDF) *
            </label>
            <input type="file" id="loan-proof-file" accept="image/*,application/pdf" required
              class="w-full text-xs text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-100 file:text-[#0A3C2A] file:font-bold" />
          </div>

          <p class="text-[11px] text-amber-800 bg-amber-50 p-2.5 rounded-xl border border-amber-200">
            <span data-i18n="dualApprovalNote"></span> (<strong id="dual-limit-badge">₹20,000</strong>)
          </p>

          <button type="submit" id="loan-submit-btn" class="w-full mint-btn py-3 rounded-xl text-sm" data-i18n="submitLoanBtn">
            আবেদন জমা দিন
          </button>
        </form>
      </div>
    </div>

    <div class="lg:col-span-7 space-y-4" id="loans-feed">
      <p class="text-xs text-gray-500 text-center py-8">...</p>
    </div>
  </main>

  <!-- Proof / Transfer Screenshot Viewer Modal -->
  <div id="proof-modal" class="hidden fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="fintech-card w-full max-w-lg p-4 animate-pop-in">
      <div class="flex justify-between items-center mb-2">
        <h4 id="proof-modal-title" class="font-bold text-sm text-[#0A3C2A]">Document Proof</h4>
        <button id="close-proof-modal" class="font-bold text-gray-500 text-lg">✕</button>
      </div>
      <div id="proof-container" class="max-h-[75vh] overflow-auto"></div>
    </div>
  </div>

  <!-- Upload Money Transfer Proof Modal (Staff) -->
  <div id="disburse-proof-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="fintech-card w-full max-w-md p-6 animate-pop-in">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-extrabold text-[#0A3C2A]" data-i18n="uploadDisburseProofBtn">📤 টাকা পাঠানোর স্ক্রিনশট আপলোড</h3>
        <button id="close-disburse-modal" class="text-gray-400 hover:text-gray-700 font-bold text-lg">✕</button>
      </div>
      <form id="disburse-proof-form" class="space-y-3">
        <input type="hidden" id="disburse-loan-id" />
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">UTR / Transaction Reference (Optional)</label>
          <input type="text" id="disburse-utr" placeholder="e.g. 432198765432"
            class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1" data-i18n="screenshotLabel">পেমেন্ট স্ক্রিনশট আপলোড *</label>
          <input type="file" id="disburse-file" accept="image/*" required
            class="w-full text-xs text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-100 file:text-[#0A3C2A] file:font-bold" />
        </div>
        <button type="submit" id="disburse-submit-btn" class="w-full mint-btn py-3 rounded-xl text-sm">
          সেভ ও সবাইকে জানান / Save Transfer Proof
        </button>
      </form>
    </div>
  </div>

  <!-- Floating Undo / Redo Bar -->
  <div id="undo-redo-bar" class="hidden fixed bottom-20 left-3 right-3 max-w-md mx-auto bg-slate-900/95 text-white rounded-2xl px-3.5 py-2 shadow-xl border border-white/15 z-40 flex items-center justify-between gap-2">
    <span id="undo-redo-label" class="text-[11px] text-emerald-200 truncate flex-1">Action recorded</span>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="global-undo-btn" class="px-2.5 py-1 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1">
        ↩️ <span data-i18n="undoBtn">Undo</span>
      </button>
      <button id="global-redo-btn" class="px-2.5 py-1 rounded-lg bg-emerald-400 text-slate-950 font-extrabold text-[11px] flex items-center gap-1">
        ↪️ <span data-i18n="redoBtn">Redo</span>
      </button>
    </div>
  </div>

  <!-- 5-Tab High-Contrast SVG Bottom Navigation Bar -->
  <nav id="bottom-nav" class="fixed bottom-3 left-2.5 right-2.5 max-w-lg mx-auto bottom-nav-pill text-white rounded-2xl px-1.5 py-2 z-40 border border-white/15">
    <div class="grid grid-cols-5 gap-0.5 text-center text-[10px] sm:text-[11px] leading-none">
      <a href="dashboard.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navHome">হোম</span>
      </a>
      <a href="ledger.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 7h6m-6 4h4"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLedger">হিসাব</span>
      </a>
      <a href="loans.html" class="text-[#5CDDAB] font-extrabold bg-[#5CDDAB]/15 rounded-xl py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLoans">লোন</span>
      </a>
      <a href="profile.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navProfile">প্রোফাইল</span>
      </a>
      <a href="settings.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-0.5 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navSettings">সেটিংস</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      requireApprovedUser,
      setupCommonUI,
      formatINR,
      compressImageToBase64,
      logAudit,
      pushUndoAction,
      askForRemarks,
      showFintechPopup,
      sendGroupNotification
    } from "./js/utils.js";
    import { getLang, t } from "./js/i18n.js";

    setupCommonUI();

    requireApprovedUser((user, me) => {
      const isAdmin = me.role === "admin";
      const isCoAdmin = me.role === "co_admin";
      const isStaff = isAdmin || isCoAdmin;
      let maxLoanLimit = 35000;
      let dualThreshold = 20000;
      let loansEnabled = true;
      let usersByUid = {};

      onSnapshot(collection(db, "users"), (snap) => {
        usersByUid = {};
        snap.forEach((d) => {
          usersByUid[d.id] = { uid: d.id, ...d.data() };
        });
        renderLoans();
      });

      onSnapshot(doc(db, "settings", "general"), (snap) => {
        const d = snap.exists() ? snap.data() : {};
        maxLoanLimit = Number(d.maxLoanLimit || 35000);
        dualThreshold = Number(d.dualThreshold || 20000);
        loansEnabled = d.loansEnabled !== false;

        document.getElementById("max-loan-badge").textContent = formatINR(maxLoanLimit);
        document.getElementById("dual-limit-badge").textContent = formatINR(dualThreshold);
        document.getElementById("loan-amount").max = maxLoanLimit;

        const btn = document.getElementById("loan-submit-btn");
        btn.disabled = !loansEnabled;
        btn.classList.toggle("opacity-50", !loansEnabled);
      });

      document.getElementById("loan-apply-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!loansEnabled) return;
        const lang = getLang();
        const btn = document.getElementById("loan-submit-btn");
        btn.disabled = true;

        try {
          const amount = Number(document.getElementById("loan-amount").value);
          const reason = document.getElementById("loan-reason").value.trim();
          const file = document.getElementById("loan-proof-file").files[0];

          if (amount > maxLoanLimit || amount <= 0) {
            throw new Error(lang === "bn" ? `সর্বোচ্চ ${formatINR(maxLoanLimit)} পর্যন্ত লোন নেওয়া যাবে।` : `Max loan limit is ${formatINR(maxLoanLimit)}.`);
          }
          if (!file) {
            throw new Error(lang === "bn" ? "জরুরি প্রমাণ আপলোড করা বাধ্যতামূলক।" : "Proof attachment is mandatory.");
          }

          const proofBase64 = await compressImageToBase64(file, 700, 0.72);
          const requiresDual = amount > dualThreshold;

          await addDoc(collection(db, "loans"), {
            uid: me.uid,
            applicantName: me.name,
            applicantUpi: me.upiId || "",
            applicantBank: me.bankAccount || "",
            applicantIfsc: me.ifsc || "",
            memberId: me.memberId || "-",
            amount,
            repaidAmount: 0,
            reason,
            proofBase64,
            requiresDualApproval: requiresDual,
            adminApproved: false,
            coAdminApproved: false,
            status: "pending",
            rejectReason: "",
            disbursementProofBase64: "",
            disbursementUtr: "",
            disbursedBy: "",
            disbursedAt: "",
            votes: {},
            createdAt: serverTimestamp(),
            submittedAtIso: new Date().toISOString()
          });

          await logAudit({
            actionType: "LOAN_APPLIED",
            messageBn: `${me.name} ${formatINR(amount)} ইমার্জেন্সি লোনের আবেদন করেছেন।`,
            messageEn: `${me.name} applied for ${formatINR(amount)} emergency loan.`,
            actorUid: me.uid,
            actorName: me.name,
            actorRole: me.role
          });

          await sendGroupNotification({
            titleBn: `🩺 নতুন ইমার্জেন্সি লোন আবেদন (${me.name})`,
            titleEn: `🩺 New Emergency Loan Request (${me.name})`,
            bodyBn: `${me.name} জরুরি প্রয়োজনে ${formatINR(amount)} লোনের আবেদন করেছেন। ভোট দিতে ট্যাপ করুন।`,
            bodyEn: `${me.name} applied for a ${formatINR(amount)} emergency loan. Tap to review & vote.`,
            targetPage: "loans.html",
            actorUid: me.uid
          });

          document.getElementById("loan-apply-form").reset();

          showFintechPopup({
            titleBn: "লোনের আবেদন সফলভাবে জমা হয়েছে!",
            titleEn: "Emergency Loan Request Submitted!",
            msgBn: `আপনার ${formatINR(amount)} (০% সুদ) লোনের আবেদন সিরিয়াল অনুযায়ী নথিভুক্ত হয়েছে এবং বাকি সব সদস্যের ফোনে নোটিফিকেশন পাঠানো হয়েছে।`,
            msgEn: `Your ${formatINR(amount)} (0% Interest) loan request is queued by priority and all members have been notified.`
          });
        } catch (err) {
          showFintechPopup({
            type: "error",
            titleBn: "আবেদন জমা হয়নি",
            titleEn: "Application Error",
            msgBn: err.message,
            msgEn: err.message
          });
        } finally {
          btn.disabled = false;
        }
      });

      let loanItems = [];
      onSnapshot(query(collection(db, "loans"), orderBy("createdAt", "asc")), (snap) => {
        loanItems = [];
        snap.forEach((d) => loanItems.push({ id: d.id, ...d.data() }));
        renderLoans();
      });

      function renderLoans() {
        const feed = document.getElementById("loans-feed");
        const lang = getLang();
        if (loanItems.length === 0) {
          feed.innerHTML = `<div class="fintech-card p-8 text-center text-xs text-gray-500">${lang === "bn" ? "এখনো কোনো লোনের আবেদন নেই।" : "No loan applications yet."}</div>`;
          return;
        }

        const pendingOrdered = loanItems.filter((x) => x.status === "pending");
        const priorityMap = {};
        pendingOrdered.forEach((item, index) => {
          priorityMap[item.id] = index + 1;
        });

        const displayOrder = [...pendingOrdered, ...loanItems.filter((x) => x.status !== "pending").reverse()];

        feed.innerHTML = displayOrder.map((l) => {
          const votes = l.votes || {};
          const agreeCount = Object.values(votes).filter((v) => v === "agree").length;
          const disagreeCount = Object.values(votes).filter((v) => v === "disagree").length;
          const myVote = votes[me.uid];
          const outstanding = Math.max(0, Number(l.amount) - Number(l.repaidAmount || 0));
          const priorityNum = priorityMap[l.id];

          const applicantProfile = usersByUid[l.uid] || {};
          const targetUpi = (applicantProfile.upiId || l.applicantUpi || "").trim();
          const targetBank = (applicantProfile.bankAccount || l.applicantBank || "").trim();
          const targetIfsc = (applicantProfile.ifsc || l.applicantIfsc || "").trim();
          const upiPayUrl = targetUpi
            ? `upi://pay?pa=${encodeURIComponent(targetUpi)}&pn=${encodeURIComponent(l.applicantName || "Member")}&am=${l.amount}&cu=INR`
            : "";

          const priorityBadge = priorityNum
            ? `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${priorityNum === 1 ? "bg-[#0A3C2A] text-[#5CDDAB] shadow-sm" : "bg-slate-200 text-slate-800"}">
                #${priorityNum} ${priorityNum === 1 ? (lang === "bn" ? "প্রথম অগ্রাধিকার" : "1st Priority") : (lang === "bn" ? "অগ্রাধিকার" : "Priority")}
              </span>`
            : "";

          const statusBadge =
            l.status === "approved"
              ? `<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold shrink-0">✓ Approved</span>`
              : l.status === "rejected"
              ? `<span class="px-2.5 py-1 rounded-full bg-red-100 text-red-700 text-xs font-extrabold shrink-0">✕ Rejected</span>`
              : `<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-extrabold shrink-0">⏳ Pending</span>`;

          return `
            <div class="fintech-card p-5 space-y-3.5 ${priorityNum === 1 ? "border-2 border-[#39D59E]" : ""}">
              <div class="flex justify-between items-start gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    ${priorityBadge}
                    <h3 class="font-extrabold text-base text-[#0A3C2A]">${l.applicantName}</h3>
                    <span class="text-xs text-gray-500">(${l.memberId || "PF"})</span>
                  </div>
                  <p class="text-xl font-extrabold text-emerald-700 mt-1">${formatINR(l.amount)} <span class="text-xs font-normal text-gray-500">(0% Interest)</span></p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${statusBadge}
                  ${isAdmin ? `<button data-id="${l.id}" class="del-loan-btn p-1.5 rounded-lg bg-red-100 text-red-700 text-xs font-bold" title="Delete Record">🗑️</button>` : ""}
                </div>
              </div>

              <p class="text-xs text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100">${l.reason}</p>
              ${l.rejectReason ? `<p class="text-xs text-red-700 bg-red-50 p-2.5 rounded-xl border border-red-200 font-semibold">Remark: ${l.rejectReason}</p>` : ""}

              <div class="flex justify-between items-center flex-wrap gap-2">
                <button data-proof="${l.proofBase64}" data-title="Emergency Proof - ${l.applicantName}" class="view-proof-btn px-3 py-1.5 rounded-xl bg-emerald-100 text-[#0A3C2A] text-xs font-bold hover:bg-emerald-200">
                  📎 ${t("viewProofBtn")}
                </button>
                ${l.requiresDualApproval ? `<span class="text-[11px] font-bold text-amber-700">🔐 Maker-Checker</span>` : ""}
              </div>

              <!-- Approved Loan Payout Details (UPI + Bank Account/IFSC) & Money Transfer Screenshot Proof -->
              ${l.status === "approved" ? `
                <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-2.5">
                  <div class="text-xs space-y-1">
                    <div class="flex justify-between items-center">
                      <span class="text-gray-600 font-semibold">UPI ID:</span>
                      <span class="font-extrabold text-[#0A3C2A] select-all">${targetUpi || "Not Set"}</span>
                    </div>
                    ${targetBank ? `
                      <div class="flex justify-between items-center">
                        <span class="text-gray-600 font-semibold">Bank A/C:</span>
                        <span class="font-extrabold text-[#0A3C2A] select-all">${targetBank} ${targetIfsc ? `(${targetIfsc})` : ""}</span>
                      </div>
                    ` : ""}
                  </div>

                  ${targetUpi ? `
                    <a href="${upiPayUrl}" class="block w-full py-2.5 px-3 rounded-xl mint-btn text-xs text-center">
                      📲 ${t("payApplicantUpiBtn")} (${formatINR(l.amount)} → ${targetUpi})
                    </a>
                  ` : (!targetBank ? `<p class="text-[11px] text-amber-800 font-semibold">${t("noApplicantPayoutNote")}</p>` : "")}

                  <!-- Public Money Transfer Proof Viewer (Visible to ALL Members) -->
                  ${l.disbursementProofBase64 ? `
                    <div class="pt-2 border-t border-emerald-200 flex flex-wrap items-center justify-between gap-2">
                      <span class="text-[11px] font-extrabold text-emerald-800">
                        ✅ Sent by ${l.disbursedBy || "Admin"} ${l.disbursementUtr ? `(UTR: ${l.disbursementUtr})` : ""}
                      </span>
                      <button data-proof="${l.disbursementProofBase64}" data-title="Money Transfer Proof - ${l.applicantName}"
                        class="view-proof-btn px-3 py-1.5 rounded-xl bg-[#0A3C2A] text-[#5CDDAB] text-xs font-bold shadow">
                        🖼️ ${t("viewDisburseProofBtn")}
                      </button>
                    </div>
                  ` : (isStaff ? `
                    <button data-id="${l.id}" class="open-disburse-proof-btn w-full py-2 px-3 rounded-xl bg-[#0A3C2A] text-[#5CDDAB] font-bold text-xs shadow">
                      ${t("uploadDisburseProofBtn")}
                    </button>
                  ` : "")}
                </div>
              ` : ""}

              <div class="p-3 rounded-2xl bg-emerald-50/70 border border-emerald-100 flex flex-wrap justify-between items-center gap-2">
                <div class="text-xs font-bold text-gray-700">
                  ${t("peerVoteLabel")} <span class="text-emerald-700">👍 ${agreeCount}</span> | <span class="text-red-600">👎 ${disagreeCount}</span>
                </div>
                ${l.status === "pending" && l.uid !== me.uid ? `
                  <div class="flex gap-2">
                    <button data-id="${l.id}" data-vote="agree"
                      class="vote-btn px-3 py-1.5 rounded-xl text-xs font-bold ${myVote === "agree" ? "bg-emerald-700 text-white" : "bg-white border text-emerald-800"}">
                      👍 ${t("agreeBtn")}
                    </button>
                    <button data-id="${l.id}" data-vote="disagree"
                      class="vote-btn px-3 py-1.5 rounded-xl text-xs font-bold ${myVote === "disagree" ? "bg-red-600 text-white" : "bg-white border text-red-700"}">
                      👎 ${t("disagreeBtn")}
                    </button>
                  </div>
                ` : ""}
              </div>

              ${l.status === "pending" ? `
                <div class="pt-2 border-t border-gray-100 flex flex-wrap justify-between items-center gap-2">
                  <div class="text-[11px] text-gray-600">
                    ${l.requiresDualApproval
                      ? `Admin: <strong>${l.adminApproved ? "✓" : "⏳"}</strong> | Co-Admin: <strong>${l.coAdminApproved ? "✓" : "⏳"}</strong>`
                      : "Single Sign-off"}
                  </div>
                  ${isStaff ? `
                    <div class="flex gap-2">
                      <button data-id="${l.id}" class="approve-loan-btn px-3.5 py-1.5 rounded-xl mint-btn text-xs">
                        ✓ ${t("approveLoanBtn")}
                      </button>
                      <button data-id="${l.id}" class="reject-loan-btn px-3 py-1.5 rounded-xl bg-red-600 text-white text-xs font-bold">
                        ✕ ${t("rejectLoanBtn")}
                      </button>
                    </div>
                  ` : ""}
                </div>
              ` : ""}

              ${l.status !== "pending" && isStaff ? `
                <div class="pt-2 border-t border-gray-100 flex flex-wrap justify-between items-center gap-2 text-xs">
                  ${l.status === "approved" ? `
                    <span>${t("loanDueLabel")} <strong class="text-red-700">${formatINR(outstanding)}</strong></span>
                  ` : `<span></span>`}
                  <div class="flex gap-2">
                    ${l.status === "approved" && outstanding > 0 ? `
                      <button data-id="${l.id}" class="repay-loan-btn px-3 py-1.5 rounded-xl bg-[#0A3C2A] text-[#5CDDAB] font-bold">
                        ${t("recordRepayBtn")}
                      </button>
                    ` : ""}
                    <button data-id="${l.id}" class="undo-loan-btn px-3 py-1.5 rounded-xl bg-amber-100 text-amber-900 font-bold">
                      ↩️ ${t("undoDecisionBtn")}
                    </button>
                  </div>
                </div>
              ` : ""}
            </div>
          `;
        }).join("");

        // Proof Modal Trigger (for both Emergency Proof & Money Transfer Proof)
        feed.querySelectorAll(".view-proof-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const src = btn.dataset.proof;
            document.getElementById("proof-modal-title").textContent = btn.dataset.title || "Document Proof";
            const container = document.getElementById("proof-container");
            if (src && src.startsWith("data:application/pdf")) {
              container.innerHTML = `<iframe src="${src}" class="w-full h-[65vh] rounded-xl"></iframe>`;
            } else {
              container.innerHTML = `<img src="${src}" class="w-full object-contain rounded-xl" />`;
            }
            document.getElementById("proof-modal").classList.remove("hidden");
          });
        });

        // Open Disbursement Screenshot Upload Modal (Staff)
        feed.querySelectorAll(".open-disburse-proof-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.getElementById("disburse-loan-id").value = btn.dataset.id;
            document.getElementById("disburse-proof-modal").classList.remove("hidden");
          });
        });

        // Admin Delete Loan Record
        feed.querySelectorAll(".del-loan-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const loan = loanItems.find((x) => x.id === btn.dataset.id);
            if (!loan) return;
            const remark = await askForRemarks({
              titleBn: `${loan.applicantName}-এর লোনের রেকর্ড ডিলিট করার কারণ`,
              titleEn: `Reason for deleting ${loan.applicantName}'s loan record`
            });
            if (!remark) return;

            await deleteDoc(doc(db, "loans", loan.id));
            await logAudit({
              actionType: "LOAN_RECORD_DELETED",
              messageBn: `Admin ${me.name} সদস্য ${loan.applicantName}-এর ${formatINR(loan.amount)} লোনের রেকর্ড ডিলিট করেছেন। কারণ: ${remark}`,
              messageEn: `Admin ${me.name} deleted ${loan.applicantName}'s ${formatINR(loan.amount)} loan record. Reason: ${remark}`,
              remark,
              actorUid: me.uid,
              actorName: me.name,
              actorRole: me.role
            });
            showFintechPopup({
              type: "info",
              titleBn: "লোনের রেকর্ড ডিলিট হয়েছে",
              titleEn: "Loan Record Deleted",
              msgBn: `${loan.applicantName}-এর লোনের রেকর্ডটি স্থায়ীভাবে মুছে ফেলা হয়েছে।`,
              msgEn: `${loan.applicantName}'s loan record has been removed.`
            });
          });
        });

        // Peer Voting
        feed.querySelectorAll(".vote-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const loan = loanItems.find((x) => x.id === btn.dataset.id);
            if (!loan) return;
            const updatedVotes = { ...(loan.votes || {}), [me.uid]: btn.dataset.vote };
            await updateDoc(doc(db, "loans", loan.id), { votes: updatedVotes });
            await logAudit({
              actionType: "LOAN_VOTED",
              messageBn: `${me.name} সদস্য ${loan.applicantName}-এর লোনে "${btn.dataset.vote.toUpperCase()}" ভোট দিয়েছেন।`,
              messageEn: `${me.name} voted "${btn.dataset.vote.toUpperCase()}" on ${loan.applicantName}'s loan.`,
              actorUid: me.uid,
              actorName: me.name,
              actorRole: me.role
            });
          });
        });

        // Maker-Checker Approve Loan
        feed.querySelectorAll(".approve-loan-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const loan = loanItems.find((x) => x.id === btn.dataset.id);
            if (!loan) return;
            const prevState = {
              adminApproved: Boolean(loan.adminApproved),
              coAdminApproved: Boolean(loan.coAdminApproved),
              status: loan.status
            };

            let adminApproved = prevState.adminApproved;
            let coAdminApproved = prevState.coAdminApproved;
            if (isAdmin) adminApproved = true;
            if (isCoAdmin) coAdminApproved = true;

            const finalApproved = loan.requiresDualApproval
              ? (adminApproved && coAdminApproved)
              : (adminApproved || coAdminApproved);

            const doApprove = async () => {
              await updateDoc(doc(db, "loans", loan.id), {
                adminApproved,
                coAdminApproved,
                status: finalApproved ? "approved" : "pending"
              });
              await logAudit({
                actionType: finalApproved ? "LOAN_APPROVED" : "LOAN_PARTIAL_APPROVED",
                messageBn: finalApproved
                  ? `${me.name} সদস্য ${loan.applicantName}-এর ${formatINR(loan.amount)} লোন অনুমোদন দিয়েছেন।`
                  : `${me.name} সদস্য ${loan.applicantName}-এর লোন আংশিক অনুমোদন দিয়েছেন।`,
                messageEn: finalApproved
                  ? `${me.name} approved ${loan.applicantName}'s ${formatINR(loan.amount)} loan.`
                  : `${me.name} signed off on ${loan.applicantName}'s loan.`,
                actorUid: me.uid,
                actorName: me.name,
                actorRole: me.role
              });
              if (finalApproved) {
                await sendGroupNotification({
                  titleBn: `✅ লোন অনুমোদিত (${loan.applicantName})`,
                  titleEn: `✅ Loan Approved (${loan.applicantName})`,
                  bodyBn: `${me.name} সদস্য ${loan.applicantName}-এর ${formatINR(loan.amount)} ইমার্জেন্সি লোন অনুমোদন দিয়েছেন।`,
                  bodyEn: `${me.name} approved ${loan.applicantName}'s ${formatINR(loan.amount)} emergency loan.`,
                  targetPage: "loans.html",
                  actorUid: me.uid
                });
              }
            };

            const doUndo = async () => {
              await updateDoc(doc(db, "loans", loan.id), prevState);
            };

            await doApprove();
            pushUndoAction({
              labelBn: `Approve Loan: ${loan.applicantName}`,
              labelEn: `Approved Loan: ${loan.applicantName}`,
              undoFn: doUndo,
              redoFn: doApprove
            });
          });
        });

        // Reject Loan
        feed.querySelectorAll(".reject-loan-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const loan = loanItems.find((x) => x.id === btn.dataset.id);
            if (!loan) return;
            const remark = await askForRemarks({
              titleBn: `${loan.applicantName}-এর লোন বাতিলের কারণ`,
              titleEn: `Reason for rejecting ${loan.applicantName}'s loan`
            });
            if (!remark) return;

            const doReject = async () => {
              await updateDoc(doc(db, "loans", loan.id), { status: "rejected", rejectReason: remark });
              await logAudit({
                actionType: "LOAN_REJECTED",
                messageBn: `${me.name} সদস্য ${loan.applicantName}-এর লোন বাতিল করেছেন। কারণ: ${remark}`,
                messageEn: `${me.name} rejected ${loan.applicantName}'s loan. Reason: ${remark}`,
                remark,
                actorUid: me.uid,
                actorName: me.name,
                actorRole: me.role
              });
              await sendGroupNotification({
                titleBn: `❌ লোন আবেদন বাতিল (${loan.applicantName})`,
                titleEn: `❌ Loan Request Rejected (${loan.applicantName})`,
                bodyBn: `${loan.applicantName}-এর ${formatINR(loan.amount)} লোনের আবেদন বাতিল হয়েছে। কারণ: ${remark}`,
                bodyEn: `${loan.applicantName}'s ${formatINR(loan.amount)} loan was rejected. Reason: ${remark}`,
                targetPage: "loans.html",
                actorUid: me.uid
              });
            };
            const doUndo = async () => {
              await updateDoc(doc(db, "loans", loan.id), { status: "pending", rejectReason: "" });
            };

            await doReject();
            pushUndoAction({
              labelBn: `Reject Loan: ${loan.applicantName}`,
              labelEn: `Rejected Loan: ${loan.applicantName}`,
              undoFn: doUndo,
              redoFn: doReject
            });
          });
        });

        // Undo Loan Decision
        feed.querySelectorAll(".undo-loan-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const loan = loanItems.find((x) => x.id === btn.dataset.id);
            if (!loan) return;
            await updateDoc(doc(db, "loans", loan.id), {
              status: "pending",
              adminApproved: false,
              coAdminApproved: false,
              rejectReason: ""
            });
            await logAudit({
              actionType: "UNDO_LOAN_DECISION",
              messageBn: `${me.name} সদস্য ${loan.applicantName}-এর লোনের পূর্বের সিদ্ধান্ত ফিরিয়ে নিয়েছেন।`,
              messageEn: `${me.name} reset ${loan.applicantName}'s loan back to Pending.`,
              actorUid: me.uid,
              actorName: me.name,
              actorRole: me.role
            });
          });
        });

        // Record Loan Repayment
        feed.querySelectorAll(".repay-loan-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const loan = loanItems.find((x) => x.id === btn.dataset.id);
            if (!loan) return;
            const outstanding = Number(loan.amount) - Number(loan.repaidAmount || 0);
            const input = prompt(`Repayment amount (Due: ₹${outstanding}):`, String(Math.min(5000, outstanding)));
            const payAmt = Number(input);
            if (!payAmt || payAmt <= 0 || payAmt > outstanding) return;

            const prevRepaid = Number(loan.repaidAmount || 0);
            const newRepaid = prevRepaid + payAmt;
            const doRepay = async () => {
              await updateDoc(doc(db, "loans", loan.id), { repaidAmount: newRepaid });
              await logAudit({
                actionType: "LOAN_REPAYMENT",
                messageBn: `${me.name} সদস্য ${loan.applicantName}-এর লোনের ${formatINR(payAmt)} কিস্তি জমা নিয়েছেন।`,
                messageEn: `${me.name} recorded ${formatINR(payAmt)} loan repayment for ${loan.applicantName}.`,
                actorUid: me.uid,
                actorName: me.name,
                actorRole: me.role
              });
            };
            const doUndo = async () => {
              await updateDoc(doc(db, "loans", loan.id), { repaidAmount: prevRepaid });
            };

            await doRepay();
            pushUndoAction({
              labelBn: `Repay ${formatINR(payAmt)}: ${loan.applicantName}`,
              labelEn: `Repaid ${formatINR(payAmt)}: ${loan.applicantName}`,
              undoFn: doUndo,
              redoFn: doRepay
            });
          });
        });
      }

      // Submit Money Transfer Proof Screenshot
      document.getElementById("disburse-proof-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("disburse-submit-btn");
        btn.disabled = true;
        try {
          const loanId = document.getElementById("disburse-loan-id").value;
          const utr = document.getElementById("disburse-utr").value.trim();
          const file = document.getElementById("disburse-file").files[0];
          const loan = loanItems.find((x) => x.id === loanId);
          if (!loan || !file) return;

          const base64 = await compressImageToBase64(file, 700, 0.72);
          await updateDoc(doc(db, "loans", loanId), {
            disbursementProofBase64: base64,
            disbursementUtr: utr,
            disbursedBy: me.name,
            disbursedAt: new Date().toISOString()
          });

          await logAudit({
            actionType: "LOAN_MONEY_TRANSFERRED",
            messageBn: `${me.name} সদস্য ${loan.applicantName}-কে ${formatINR(loan.amount)} লোনের টাকা ট্রান্সফার করে স্ক্রিনশট আপলোড করেছেন।`,
            messageEn: `${me.name} transferred ${formatINR(loan.amount)} loan to ${loan.applicantName} and uploaded payment proof.`,
            actorUid: me.uid,
            actorName: me.name,
            actorRole: me.role
          });

          await sendGroupNotification({
            titleBn: `💰 লোনের টাকা ট্রান্সফার সম্পন্ন (${loan.applicantName})`,
            titleEn: `💰 Loan Money Transferred (${loan.applicantName})`,
            bodyBn: `${me.name} সদস্য ${loan.applicantName}-কে ${formatINR(loan.amount)} পাঠিয়ে প্রমাণ আপলোড করেছেন।`,
            bodyEn: `${me.name} sent ${formatINR(loan.amount)} to ${loan.applicantName} and uploaded transfer proof.`,
            targetPage: "loans.html",
            actorUid: me.uid
          });

          document.getElementById("disburse-proof-form").reset();
          document.getElementById("disburse-proof-modal").classList.add("hidden");
          showFintechPopup({
            titleBn: "টাকা পাঠানোর প্রমাণ সেভ হয়েছে!",
            titleEn: "Transfer Proof Uploaded!",
            msgBn: "পেমেন্ট স্ক্রিনশটটি সেভ হয়েছে—এখন গ্রুপের সব সদস্য এটি দেখতে পাবেন।",
            msgEn: "The transfer screenshot is now saved and visible to all members."
          });
        } catch (err) {
          showFintechPopup({ type: "error", titleBn: "ত্রুটি", titleEn: "Error", msgBn: err.message, msgEn: err.message });
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById("close-disburse-modal").addEventListener("click", () => {
        document.getElementById("disburse-proof-modal").classList.add("hidden");
      });
      window.addEventListener("languageChanged", renderLoans);
      document.getElementById("close-proof-modal").addEventListener("click", () => {
        document.getElementById("proof-modal").classList.add("hidden");
      });
    });
  </script>
</body>
</html>
