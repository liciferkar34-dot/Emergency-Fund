<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer Fund — Emergency Loans</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A3C2A">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero-header">
      <div class="header-top">
        <div class="brand-row">
          <div class="brand-logo">💸</div>
          <div>
            <div class="greeting-name" data-i18n="loans">Emergency Loans</div>
            <div class="greeting-small">0% Interest • Max ₹35,000 • 6 Months</div>
          </div>
        </div>
        <button class="lang-btn" id="lang-toggle">বাংলা</button>
      </div>
    </header>

    <main class="content">
      <!-- Apply Form -->
      <div class="card">
        <div class="section-title"><span>Apply for Emergency Fund</span></div>
        <form id="loan-form">
          <div class="form-group">
            <label class="form-label">Emergency Fund Amount (Max ₹35,000)</label>
            <input type="number" class="input" id="loan-amount" required min="1000" max="35000" placeholder="e.g. 25000">
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center;">
            <div style="background:var(--mint-soft);padding:8px;border-radius:10px;font-size:11px;"><strong>Admin Fee</strong><br>₹0</div>
            <div style="background:var(--mint-soft);padding:8px;border-radius:10px;font-size:11px;"><strong>Term</strong><br>6 Months</div>
            <div style="background:var(--mint-soft);padding:8px;border-radius:10px;font-size:11px;"><strong>Interest</strong><br>0%</div>
          </div>
          <div class="form-group">
            <label class="form-label">Emergency Reason</label>
            <textarea class="textarea" id="loan-reason" rows="3" required placeholder="Explain the medical/family emergency..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Mandatory Proof Attachment (Hospital Bill / Prescription Image)</label>
            <input type="file" class="input" id="loan-proof" accept="image/*,application/pdf" required>
          </div>
          <button type="submit" class="btn btn-mint btn-full" id="loan-submit">Submit Application</button>
        </form>
      </div>

      <!-- Loan Requests & Active EMI Feed -->
      <div class="section-title" style="margin:4px 0 0;"><span>Loan Applications & Peer Voting</span></div>
      <div id="loans-list" class="empty-state">Loading loans...</div>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <!-- Proof Viewer Modal -->
  <div class="modal-backdrop" id="proof-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Attached Emergency Proof</h3>
        <button class="modal-close" id="close-proof">✕</button>
      </div>
      <div id="proof-body"></div>
    </div>
  </div>

  <script type="module">
    import {
      collection, getDocs, doc, addDoc, updateDoc, serverTimestamp, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      db, requireApprovedUser, renderBottomNav, toggleLang, formatINR,
      compressImageToBase64, showToast, writeAuditLog
    } from "./js/app.js";

    renderBottomNav("loans");
    document.getElementById("lang-toggle").addEventListener("click", toggleLang);

    let currentUser = null;
    let loans = [];

    requireApprovedUser(async (user) => {
      currentUser = user;
      await loadLoans();
    });

    function buildEmiSchedule(amount) {
      const monthly = Math.ceil(amount / 6);
      const list = [];
      const now = new Date();
      for (let i = 1; i <= 6; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 5);
        list.push({
          installment: i,
          dueDate: d.toISOString().slice(0, 10),
          amount: i === 6 ? Math.max(0, amount - monthly * 5) : monthly,
          paid: false
        });
      }
      return list;
    }

    async function loadLoans() {
      const snap = await getDocs(query(collection(db, "loans"), orderBy("clientTime", "desc")));
      loans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderLoans();
    }

    function renderLoans() {
      const el = document.getElementById("loans-list");
      if (!loans.length) {
        el.innerHTML = `<div class="empty-state">No loan applications yet.</div>`;
        return;
      }
      el.className = "";
      el.style.display = "flex";
      el.style.flexDirection = "column";
      el.style.gap = "12px";

      el.innerHTML = loans.map(l => {
        const votes = l.votes || {};
        const agreeCount = Object.values(votes).filter(v => v === "agree").length;
        const disagreeCount = Object.values(votes).filter(v => v === "disagree").length;
        const myVote = votes[currentUser.uid];
        const needsDual = Number(l.amount) > 20000;
        const adminOk = !!l.adminApproved;
        const coAdminOk = !!l.coAdminApproved;

        const badgeCls = l.status === "disbursed" || l.status === "repaid" ? "badge-active" : (l.status === "rejected" ? "badge-overdue" : "badge-pending");

        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
              <div>
                <div style="font-size:15px;font-weight:800;">${l.userName}</div>
                <div style="font-size:20px;font-weight:800;color:var(--emerald);">${formatINR(l.amount)}</div>
              </div>
              <span class="badge ${badgeCls}">${(l.status || "pending").toUpperCase()}</span>
            </div>
            <p style="font-size:13px;color:var(--muted);margin:8px 0;">${l.reason}</p>

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
              <button class="btn btn-outline btn-sm view-proof" data-id="${l.id}">📎 View Proof</button>
              <span class="badge badge-active">👍 Agree: ${agreeCount}</span>
              <span class="badge badge-overdue">👎 Disagree: ${disagreeCount}</span>
            </div>

            ${needsDual && l.status === "pending" ? `
              <div style="font-size:11px;background:var(--warning-bg);color:#92400E;padding:8px;border-radius:10px;margin-bottom:10px;">
                <strong>Maker-Checker (>₹20,000):</strong> Admin: ${adminOk ? "✅" : "⏳"} | Co-Admin: ${coAdminOk ? "✅" : "⏳"}
              </div>
            ` : ""}

            ${l.status === "pending" && l.uid !== currentUser.uid ? `
              <div style="display:flex;gap:8px;margin-bottom:10px;">
                <button class="btn ${myVote === "agree" ? "btn-mint" : "btn-outline"} btn-sm vote-btn" data-id="${l.id}" data-v="agree">👍 Agree</button>
                <button class="btn ${myVote === "disagree" ? "btn-danger" : "btn-outline"} btn-sm vote-btn" data-id="${l.id}" data-v="disagree">👎 Disagree</button>
              </div>
            ` : ""}

            ${l.status === "pending" && (currentUser.role === "admin" || currentUser.role === "co_admin") ? `
              <div class="action-row">
                <button class="btn btn-mint btn-sm approve-loan" data-id="${l.id}">
                  ${needsDual ? `Sign Off (${currentUser.role.toUpperCase()})` : "Approve & Disburse"}
                </button>
                <button class="btn btn-danger btn-sm reject-loan" data-id="${l.id}">Reject</button>
              </div>
            ` : ""}

            ${Array.isArray(l.emiSchedule) && l.emiSchedule.length ? `
              <div style="margin-top:10px;">
                <div style="font-size:12px;font-weight:700;">6-Month EMI Schedule (Remaining: ${formatINR(l.remainingBalance ?? l.amount)})</div>
                <table class="emi-table">
                  <thead><tr><th>#</th><th>Due Date</th><th>EMI</th><th>Status</th></tr></thead>
                  <tbody>
                    ${l.emiSchedule.map((e, idx) => `
                      <tr>
                        <td>${e.installment}</td>
                        <td>${e.dueDate}</td>
                        <td>${formatINR(e.amount)}</td>
                        <td>
                          ${e.paid ? "✅ Paid" : (
                            (currentUser.role === "admin" || currentUser.role === "co_admin")
                              ? `<button class="btn btn-mint btn-sm pay-emi" data-id="${l.id}" data-idx="${idx}">Mark Paid</button>`
                              : "⏳ Due"
                          )}
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      // View Proof
      el.querySelectorAll(".view-proof").forEach(b => b.addEventListener("click", () => {
        const loan = loans.find(x => x.id === b.dataset.id);
        const body = document.getElementById("proof-body");
        if (loan.proofBase64 && loan.proofBase64.startsWith("data:application/pdf")) {
          body.innerHTML = `<iframe src="${loan.proofBase64}" style="width:100%;height:380px;border:none;border-radius:12px;"></iframe>`;
        } else if (loan.proofBase64) {
          body.innerHTML = `<img src="${loan.proofBase64}" class="proof-img" style="max-height:420px;">`;
        } else {
          body.innerHTML = `<p>No proof attached.</p>`;
        }
        document.getElementById("proof-modal").classList.add("open");
      }));

      // Peer Voting
      el.querySelectorAll(".vote-btn").forEach(b => b.addEventListener("click", async () => {
        await updateDoc(doc(db, "loans", b.dataset.id), {
          [`votes.${currentUser.uid}`]: b.dataset.v
        });
        showToast("Vote recorded!");
        loadLoans();
      }));

      // Maker-Checker Approval / Disbursement
      el.querySelectorAll(".approve-loan").forEach(b => b.addEventListener("click", async () => {
        const l = loans.find(x => x.id === b.dataset.id);
        const needsDual = Number(l.amount) > 20000;
        const updates = {};
        if (currentUser.role === "admin") updates.adminApproved = true;
        if (currentUser.role === "co_admin") updates.coAdminApproved = true;

        const willDisburse = !needsDual
          ? (currentUser.role === "admin")
          : ((updates.adminApproved || l.adminApproved) && (updates.coAdminApproved || l.coAdminApproved));

        if (willDisburse) {
          updates.status = "disbursed";
          updates.emiSchedule = buildEmiSchedule(Number(l.amount));
          updates.remainingBalance = Number(l.amount);
        }
        await updateDoc(doc(db, "loans", l.id), updates);
        await writeAuditLog(currentUser, willDisburse ? "LOAN_DISBURSED" : "LOAN_SIGNED_OFF",
          `${willDisburse ? "Approved & Disbursed" : "Signed off"} ₹${l.amount} loan for ${l.userName}`,
          `${l.userName}-এর ₹${l.amount} লোন ${willDisburse ? "অনুমোদন" : "সাইন-অফ"} করা হয়েছে`
        );
        showToast(willDisburse ? "Loan approved & 6-month EMI schedule created!" : "Sign-off saved! Waiting for second approval.");
        loadLoans();
      }));

      // Reject Loan
      el.querySelectorAll(".reject-loan").forEach(b => b.addEventListener("click", async () => {
        const l = loans.find(x => x.id === b.dataset.id);
        await updateDoc(doc(db, "loans", l.id), { status: "rejected" });
        await writeAuditLog(currentUser, "LOAN_REJECTED", `Rejected ₹${l.amount} loan for ${l.userName}`, `${l.userName}-এর লোন বাতিল করা হয়েছে`);
        showToast("Loan rejected.");
        loadLoans();
      }));

      // Mark EMI Paid
      el.querySelectorAll(".pay-emi").forEach(b => b.addEventListener("click", async () => {
        const l = loans.find(x => x.id === b.dataset.id);
        const idx = Number(b.dataset.idx);
        const sched = [...l.emiSchedule];
        sched[idx].paid = true;
        const rem = sched.filter(s => !s.paid).reduce((sum, s) => sum + Number(s.amount), 0);
        await updateDoc(doc(db, "loans", l.id), {
          emiSchedule: sched,
          remainingBalance: rem,
          status: rem <= 0 ? "repaid" : "disbursed"
        });
        await addDoc(collection(db, "transactions"), {
          uid: l.uid, userName: l.userName, amount: sched[idx].amount,
          type: `Loan EMI #${sched[idx].installment}`, month: sched[idx].dueDate.slice(0, 7),
          utr: "EMI Repayment", status: "verified", verifiedBy: currentUser.name,
          createdAt: serverTimestamp(), clientTime: new Date().toISOString()
        });
        await writeAuditLog(currentUser, "EMI_PAID", `Marked EMI #${sched[idx].installment} (₹${sched[idx].amount}) paid for ${l.userName}`, `${l.userName}-এর কিস্তি #${sched[idx].installment} জমা হয়েছে`);
        showToast("EMI recorded!");
        loadLoans();
      }));
    }

    // Submit Loan Form
    document.getElementById("loan-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loan-submit");
      const amount = Number(document.getElementById("loan-amount").value);
      const reason = document.getElementById("loan-reason").value.trim();
      const file = document.getElementById("loan-proof").files[0];

      if (amount > 35000 || amount < 1000) {
        showToast("Loan amount must be between ₹1,000 and ₹35,000");
        return;
      }
      if (!file) {
        showToast("Proof attachment is mandatory!");
        return;
      }
      btn.disabled = true;
      try {
        const proofBase64 = await compressImageToBase64(file, 640, 0.72);
        await addDoc(collection(db, "loans"), {
          uid: currentUser.uid, userName: currentUser.name, amount, reason,
          proofBase64, status: "pending", votes: {},
          adminApproved: false, coAdminApproved: false,
          createdAt: serverTimestamp(), clientTime: new Date().toISOString()
        });
        await writeAuditLog(currentUser, "LOAN_APPLIED", `${currentUser.name} applied for ₹${amount} emergency loan.`, `${currentUser.name} ₹${amount} ইমার্জেন্সি লোনের আবেদন করেছেন।`);
        document.getElementById("loan-form").reset();
        showToast("Loan application submitted for peer voting!");
        loadLoans();
      } catch (err) {
        showToast(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("close-proof").addEventListener("click", () => document.getElementById("proof-modal").classList.remove("open"));
  </script>
</body>
</html>
