<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer Fund — Rules & Regulations</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A3C2A">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero-header">
      <div class="header-top">
        <div class="brand-row">
          <a href="dashboard.html" class="icon-btn">←</a>
          <div>
            <div class="greeting-name" data-i18n="rules">Rules & Regulations</div>
            <div class="greeting-small">Peer Fund Mutual Agreement</div>
          </div>
        </div>
        <button class="lang-btn" id="lang-toggle">বাংলা</button>
      </div>
    </header>

    <main class="content">
      <div class="card" id="rules-body" style="line-height:1.65;font-size:14px;"></div>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script type="module">
    import { requireApprovedUser, renderBottomNav, toggleLang, getLang } from "./js/app.js";

    renderBottomNav("home");
    function renderRules() {
      const bn = getLang() === "bn";
      document.getElementById("rules-body").innerHTML = bn ? `
        <h3 style="margin-bottom:10px;color:var(--emerald-dark);">পিয়ার ফান্ডের নিয়মাবলী</h3>
        <ol style="padding-left:18px;display:grid;gap:10px;">
          <li><strong>মাসিক চাঁদা:</strong> প্রত্যেক সদস্যকে প্রতি মাসের ৫ তারিখের মধ্যে ₹১,০০০ ফান্ডে জমা দিতে হবে।</li>
          <li><strong>লেট ফাইন:</strong> ৫ তারিখের পর চাঁদা বাকি থাকলে অটোমেটিক Overdue দেখানো হবে এবং ₹১০০ লেট ফাইন প্রযোজ্য হবে।</li>
          <li><strong>ইমার্জেন্সি লোন:</strong> শুধুমাত্র প্রকৃত বিপদে সর্বোচ্চ ₹৩৫,০০০ পর্যন্ত ০% সুদে লোন পাওয়া যাবে (৬ মাসের কিস্তিতে ফেরতযোগ্য)।</li>
          <li><strong>প্রমাণ ও ভোটিং:</strong> লোনের আবেদনের সাথে প্রমাণ (বিল/প্রেসক্রিপশন) আপলোড করা বাধ্যতামূলক এবং বাকি বন্ধুদের ভোটিং দেখা হবে।</li>
          <li><strong>ডুয়াল অ্যাপ্রুভাল:</strong> ₹২০,০০০-এর বেশি লোনের জন্য Admin এবং Co-Admin—উভয়ের অনুমোদন প্রয়োজন।</li>
          <li><strong>স্বচ্ছতা:</strong> প্রতিটি লেনদেনের স্থায়ী অডিট লগ সংরক্ষিত থাকবে, যা কেউ ডিলিট করতে পারবে না।</li>
          <li><strong>এক্সিট সেটেলমেন্ট:</strong> কোনো সদস্য ফান্ড ছাড়লে তার মোট জমা থেকে বকেয়া লোন ও ফাইন বাদ দিয়ে বাকি টাকা ফেরত পাবেন।</li>
        </ol>
      ` : `
        <h3 style="margin-bottom:10px;color:var(--emerald-dark);">Peer Fund Rules & Regulations</h3>
        <ol style="padding-left:18px;display:grid;gap:10px;">
          <li><strong>Monthly Deposit:</strong> Every approved member contributes ₹1,000 by the 5th of every month via UPI + UTR verification.</li>
          <li><strong>Late Fine:</strong> Unpaid contributions after the 5th are automatically flagged Overdue with a ₹100 late fine.</li>
          <li><strong>Emergency Loans:</strong> Genuine emergencies qualify for up to ₹35,000 at 0% interest, repayable over 6 monthly EMIs.</li>
          <li><strong>Proof & Peer Voting:</strong> Proof attachment (hospital bill/prescription) is mandatory; all other members vote Agree/Disagree.</li>
          <li><strong>Maker-Checker Dual Approval:</strong> Loans above ₹20,000 require sign-off from both Admin and Co-Admin before disbursement.</li>
          <li><strong>Immutable Transparency:</strong> Every deposit, fine, and loan action is permanently logged in the read-only Audit Log.</li>
          <li><strong>Exit Settlement:</strong> Exiting members receive Total Contributed minus Active Loan Dues and Pending Fines.</li>
        </ol>
      `;
    }
    document.getElementById("lang-toggle").addEventListener("click", () => { toggleLang(); renderRules(); });
    requireApprovedUser(() => renderRules());
  </script>
</body>
</html>
