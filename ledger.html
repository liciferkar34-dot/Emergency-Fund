<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer Fund — Member Ledger</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A3C2A">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero-header">
      <div class="header-top">
        <div class="brand-row">
          <div class="brand-logo">📒</div>
          <div>
            <div class="greeting-name" data-i18n="ledger">Member Ledger</div>
            <div class="greeting-small" id="ledger-subtitle">Loading members...</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn hidden" id="open-settings-btn">⚙️ Fund</button>
          <button class="lang-btn" id="lang-toggle">বাংলা</button>
        </div>
      </div>
      <input type="search" class="input" id="search-input" placeholder="Search member by name or phone..." style="background:rgba(255,255,255,0.95);">
    </header>

    <main class="content">
      <!-- Admin Approval Queue -->
      <div class="card hidden" id="approval-section" style="border-color:#F59E0B;">
        <div class="section-title"><span>⏳ Pending Member Approvals</span></div>
        <div id="approval-list"></div>
      </div>

      <!-- Pending UTR Verification Queue (Admin/Co-Admin) -->
      <div class="card hidden" id="utr-section" style="border-color:var(--mint-bright);">
        <div class="section-title"><span>🧾 Pending UTR Verifications</span></div>
        <div id="utr-list"></div>
      </div>

      <!-- Filter Chips -->
      <div class="chips" id="filter-chips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="pending">Pending</button>
        <button class="chip" data-filter="overdue">Overdue</button>
      </div>

      <!-- Dynamic Approved Members List -->
      <div id="members-list" class="empty-state">Loading member ledger...</div>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <!-- Member-to-Member Profile Visibility Modal -->
  <div class="modal-backdrop" id="member-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Member Profile</h3>
        <button class="modal-close" id="close-member">✕</button>
      </div>
      <div id="member-modal-body"></div>
    </div>
  </div>

  <!-- Admin Fund Settings Modal (UPI ID & Late Fine) -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Fund Settings (Admin)</h3>
        <button class="modal-close" id="close-settings">✕</button>
      </div>
      <form id="settings-form">
        <div class="form-group">
          <label class="form-label">Fund UPI ID</label>
          <input type="text" class="input" id="set-upi" required placeholder="yourupi@okaxis">
        </div>
        <div class="form-group">
          <label class="form-label">Default Late Fine (₹ after 5th of month)</label>
          <input type="number" class="input" id="set-fine" required value="100">
        </div>
        <button type="submit" class="btn btn-mint btn-full">Save Settings</button>
      </form>
    </div>
  </div>

  <script type="module">
    import {
      collection, getDocs, doc, getDoc, updateDoc, deleteDoc, setDoc, addDoc,
      arrayUnion, increment, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      db, requireApprovedUser, renderBottomNav, toggleLang, formatINR, renderAvatar,
      currentMonthKey, showToast, writeAuditLog, t
    } from "./js/app.js";

    renderBottomNav("ledger");
    document.getElementById("lang-toggle").addEventListener("click", () => { toggleLang(); renderMembers(); });

    let currentUser = null;
    let allUsers = [];
    let pendingUTRs = [];
    let activeFilter = "all";
    let defaultLateFine = 100;

    requireApprovedUser(async (user) => {
      currentUser = user;
      if (user.role === "admin") {
        document.getElementById("open-settings-btn").classList.remove("hidden");
      }
      await loadLedger();
    });

    async function loadLedger() {
      const [uSnap, txSnap, setSnap] = await Promise.all([
        getDocs(collection(db, "users")),
        getDocs(collection(db, "transactions")),
        getDoc(doc(db, "settings", "fund"))
      ]);

      if (setSnap.exists()) {
        defaultLateFine = Number(setSnap.data().lateFine || 100);
        document.getElementById("set-upi").value = setSnap.data().upiId || "";
        document.getElementById("set-fine").value = defaultLateFine;
      }

      allUsers = uSnap.docs.map(d => ({ uid: d.id, ...d.data() }));
      pendingUTRs = txSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.status === "pending");

      renderApprovals();
      renderUTRs();
      renderMembers();
    }

    function isStaff() {
      return currentUser && (currentUser.role === "admin" || currentUser.role === "co_admin");
    }

    function getMemberStatus(m) {
      const month = currentMonthKey();
      const paidThisMonth = Array.isArray(m.paidMonths) && m.paidMonths.includes(month);
      if (paidThisMonth) return "active";
      return new Date().getDate() > 5 ? "overdue" : "pending";
    }

    function renderApprovals() {
      const sec = document.getElementById("approval-section");
      const list = document.getElementById("approval-list");
      const pending = allUsers.filter(u => u.approvalStatus === "pending");
      if (!isStaff() || !pending.length) {
        sec.classList.add("hidden");
        return;
      }
      sec.classList.remove("hidden");
      list.innerHTML = pending.map(u => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <div>
            <div style="font-weight:700;font-size:14px;">${u.name}</div>
            <div style="font-size:11px;color:var(--muted);">${u.email} • ${u.phone}</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-mint btn-sm appr-btn" data-uid="${u.uid}" data-name="${u.name}">Approve</button>
            <button class="btn btn-danger btn-sm rej-btn" data-uid="${u.uid}" data-name="${u.name}">Reject</button>
          </div>
        </div>
      `).join("");

      list.querySelectorAll(".appr-btn").forEach(b => b.addEventListener("click", async () => {
        await updateDoc(doc(db, "users", b.dataset.uid), { approvalStatus: "approved" });
        await writeAuditLog(currentUser, "MEMBER_APPROVED", `Approved member ${b.dataset.name}`, `${b.dataset.name}-কে অনুমোদন করা হয়েছে`);
        showToast("Member approved!");
        loadLedger();
      }));
      list.querySelectorAll(".rej-btn").forEach(b => b.addEventListener("click", async () => {
        await updateDoc(doc(db, "users", b.dataset.uid), { approvalStatus: "rejected" });
        await writeAuditLog(currentUser, "MEMBER_REJECTED", `Rejected signup ${b.dataset.name}`, `${b.dataset.name}-এর আবেদন বাতিল করা হয়েছে`);
        showToast("Signup rejected.");
        loadLedger();
      }));
    }

    function renderUTRs() {
      const sec = document.getElementById("utr-section");
      const list = document.getElementById("utr-list");
      if (!isStaff() || !pendingUTRs.length) {
        sec.classList.add("hidden");
        return;
      }
      sec.classList.remove("hidden");
      list.innerHTML = pendingUTRs.map(tx => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;justify-content:space-between;">
            <strong>${tx.userName}</strong>
            <strong style="color:var(--emerald);">${formatINR(tx.amount)}</strong>
          </div>
          <div style="font-size:12px;color:var(--muted);">UTR: ${tx.utr} • Month: ${tx.month}</div>
          ${tx.screenshotBase64 ? `<img src="${tx.screenshotBase64}" class="proof-img" style="max-height:140px;">` : ""}
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn btn-mint btn-sm ver-utr" data-id="${tx.id}" data-uid="${tx.uid}" data-amt="${tx.amount}" data-month="${tx.month}" data-name="${tx.userName}">Verify</button>
            <button class="btn btn-danger btn-sm rej-utr" data-id="${tx.id}" data-name="${tx.userName}">Reject</button>
          </div>
        </div>
      `).join("");

      list.querySelectorAll(".ver-utr").forEach(b => b.addEventListener("click", async () => {
        const amt = Number(b.dataset.amt || 1000);
        await updateDoc(doc(db, "transactions", b.dataset.id), { status: "verified", verifiedBy: currentUser.name });
        await updateDoc(doc(db, "users", b.dataset.uid), {
          totalPaid: increment(amt),
          paidMonths: arrayUnion(b.dataset.month || currentMonthKey())
        });
        await writeAuditLog(currentUser, "UTR_VERIFIED", `Verified ₹${amt} UTR from ${b.dataset.name}`, `${b.dataset.name}-এর ₹${amt} পেমেন্ট ভেরিফাই করা হয়েছে`);
        showToast("Payment verified!");
        loadLedger();
      }));

      list.querySelectorAll(".rej-utr").forEach(b => b.addEventListener("click", async () => {
        await updateDoc(doc(db, "transactions", b.dataset.id), { status: "rejected" });
        await writeAuditLog(currentUser, "UTR_REJECTED", `Rejected UTR from ${b.dataset.name}`, `${b.dataset.name}-এর UTR বাতিল করা হয়েছে`);
        showToast("UTR rejected.");
        loadLedger();
      }));
    }

    function renderMembers() {
      const q = document.getElementById("search-input").value.trim().toLowerCase();
      const approved = allUsers.filter(u => u.approvalStatus === "approved");
      document.getElementById("ledger-subtitle").textContent = `${approved.length} Approved Members • Month: ${currentMonthKey()}`;

      const filtered = approved.filter(m => {
        const st = getMemberStatus(m);
        if (activeFilter !== "all" && st !== activeFilter) return false;
        if (q && !(m.name || "").toLowerCase().includes(q) && !(m.phone || "").includes(q)) return false;
        return true;
      });

      const container = document.getElementById("members-list");
      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">No members match your filter.</div>`;
        return;
      }

      container.className = "";
      container.style.display = "flex";
      container.style.flexDirection = "column";
      container.style.gap = "12px";

      container.innerHTML = filtered.map(m => {
        const st = getMemberStatus(m);
        const pct = Math.min(100, Math.round((Number(m.totalPaid || 0) / 6000) * 100));
        const badgeCls = st === "active" ? "badge-active" : (st === "overdue" ? "badge-overdue" : "badge-pending");
        const autoFine = (st === "overdue" && !m.pendingFine) ? defaultLateFine : Number(m.pendingFine || 0);
        const waUrl = `https://wa.me/91${m.phone}?text=${encodeURIComponent(t("waMsg"))}`;

        return `
          <div class="member-card">
            <div class="member-top view-profile" data-uid="${m.uid}">
              ${renderAvatar(m)}
              <div class="member-info">
                <div class="member-name">${m.name}</div>
                <div class="member-sub">${m.memberId || ""} • ${m.role.toUpperCase()}</div>
              </div>
              <span class="badge ${badgeCls}">${t(st)}</span>
            </div>
            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;">
                <span>Paid: <strong>${formatINR(m.totalPaid)} / ₹6,000</strong></span>
                ${autoFine > 0 ? `<span style="color:var(--danger);font-weight:700;">⚠️ Fine: ${formatINR(autoFine)}</span>` : ""}
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
            ${isStaff() ? `
              <div class="action-row">
                <button class="btn btn-mint btn-sm add-dep" data-uid="${m.uid}" data-name="${m.name}">+ Deposit ₹1,000</button>
                ${st !== "active" ? `<a href="${waUrl}" target="_blank" class="btn btn-wa btn-sm">💬 WhatsApp</a>` : ""}
                <button class="btn btn-outline btn-sm fine-btn" data-uid="${m.uid}" data-name="${m.name}" data-fine="${m.pendingFine || 0}">
                  ${(m.pendingFine || 0) > 0 ? "Waive Fine" : `+ Fine ₹${defaultLateFine}`}
                </button>
                ${currentUser.role === "admin" && m.role !== "admin" ? `
                  <button class="btn btn-outline btn-sm coadmin-btn" data-uid="${m.uid}" data-name="${m.name}" data-role="${m.role}">
                    ${m.role === "co_admin" ? "Remove Co-Admin" : "Make Co-Admin"}
                  </button>
                ` : ""}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      // View Member Profile Modal (12-Member+ Profile Visibility)
      container.querySelectorAll(".view-profile").forEach(el => {
        el.addEventListener("click", () => {
          const m = allUsers.find(u => u.uid === el.dataset.uid);
          if (!m) return;
          const canSeeBank = (m.uid === currentUser.uid || isStaff());
          document.getElementById("member-modal-body").innerHTML = `
            <div style="text-align:center;margin-bottom:14px;">
              <div style="display:flex;justify-content:center;margin-bottom:8px;">${renderAvatar(m, "avatar-lg")}</div>
              <h3 style="font-size:18px;">${m.name}</h3>
              <span class="badge badge-admin">${m.role.toUpperCase()} • ${m.memberId || ""}</span>
            </div>
            <div style="display:grid;gap:10px;font-size:13px;">
              <div class="card" style="padding:12px;">
                <strong>Total Paid:</strong> ${formatINR(m.totalPaid)}<br>
                <strong>Mobile:</strong> ${m.phone} <a href="tel:${m.phone}" class="btn btn-mint btn-sm" style="margin-left:8px;">📞 Call</a><br>
                <strong>Blood Group:</strong> ${m.bloodGroup || "Not updated"}<br>
                <strong>Emergency Contact (SOS):</strong> ${m.emergencyContact || "Not updated"}
                ${m.emergencyContact ? `<a href="tel:${m.emergencyContact}" class="btn btn-danger btn-sm" style="margin-left:6px;">SOS Call</a>` : ""}
              </div>
              ${canSeeBank ? `
                <div class="card" style="padding:12px;background:var(--mint-soft);">
                  <strong>Payout Details (Private):</strong><br>
                  UPI ID: ${m.upiId || "Not set"}<br>
                  Bank A/C: ${m.bankAccount || "Not set"} (${m.ifsc || "-"})<br>
                  Nominee: ${m.nominee || "Not set"}
                </div>
              ` : ""}
            </div>
          `;
          document.getElementById("member-modal").classList.add("open");
        });
      });

      // Admin Deposit ₹1,000
      container.querySelectorAll(".add-dep").forEach(b => b.addEventListener("click", async () => {
        const month = currentMonthKey();
        await addDoc(collection(db, "transactions"), {
          uid: b.dataset.uid, userName: b.dataset.name, amount: 1000,
          type: "Monthly Deposit", month, utr: "Admin Direct Entry", status: "verified",
          verifiedBy: currentUser.name, createdAt: serverTimestamp(), clientTime: new Date().toISOString()
        });
        await updateDoc(doc(db, "users", b.dataset.uid), {
          totalPaid: increment(1000), paidMonths: arrayUnion(month)
        });
        await writeAuditLog(currentUser, "ADMIN_DEPOSIT", `Recorded ₹1,000 deposit for ${b.dataset.name}`, `${b.dataset.name}-এর ₹১,০০০ জমা এন্ট্রি করা হয়েছে`);
        showToast(`₹1,000 recorded for ${b.dataset.name}`);
        loadLedger();
      }));

      // Apply / Waive Fine
      container.querySelectorAll(".fine-btn").forEach(b => b.addEventListener("click", async () => {
        const curFine = Number(b.dataset.fine || 0);
        const newFine = curFine > 0 ? 0 : defaultLateFine;
        await updateDoc(doc(db, "users", b.dataset.uid), { pendingFine: newFine });
        await writeAuditLog(currentUser, newFine > 0 ? "FINE_APPLIED" : "FINE_WAIVED",
          `${newFine > 0 ? "Applied ₹" + newFine + " fine" : "Waived fine"} for ${b.dataset.name}`,
          `${b.dataset.name}-এর ফাইন আপডেট করা হয়েছে (₹${newFine})`
        );
        showToast(newFine > 0 ? "Late fine applied" : "Fine waived");
        loadLedger();
      }));

      // Promote/Demote Co-Admin
      container.querySelectorAll(".coadmin-btn").forEach(b => b.addEventListener("click", async () => {
        const newRole = b.dataset.role === "co_admin" ? "member" : "co_admin";
        await updateDoc(doc(db, "users", b.dataset.uid), { role: newRole });
        await writeAuditLog(currentUser, "ROLE_CHANGED", `Changed ${b.dataset.name} role to ${newRole}`, `${b.dataset.name}-এর রোল ${newRole} করা হয়েছে`);
        showToast("Role updated!");
        loadLedger();
      }));
    }

    // Filter Chips & Search
    document.querySelectorAll(".chip").forEach(c => {
      c.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        activeFilter = c.dataset.filter;
        renderMembers();
      });
    });
    document.getElementById("search-input").addEventListener("input", renderMembers);

    // Modals
    document.getElementById("close-member").addEventListener("click", () => document.getElementById("member-modal").classList.remove("open"));
    const setModal = document.getElementById("settings-modal");
    document.getElementById("open-settings-btn").addEventListener("click", () => setModal.classList.add("open"));
    document.getElementById("close-settings").addEventListener("click", () => setModal.classList.remove("open"));
    document.getElementById("settings-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await setDoc(doc(db, "settings", "fund"), {
        upiId: document.getElementById("set-upi").value.trim(),
        lateFine: Number(document.getElementById("set-fine").value || 100)
      }, { merge: true });
      setModal.classList.remove("open");
      showToast("Fund settings saved!");
      loadLedger();
    });
  </script>
</body>
</html>
