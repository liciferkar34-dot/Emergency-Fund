<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্ট্রেশন - Emergency Fund</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96 border-t-4 border-blue-700">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800" id="form-title">নতুন অ্যাকাউন্ট তৈরি</h2>
            <button id="lang-btn" class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs font-bold">EN/BN</button>
        </div>
        <form id="register-form" class="space-y-4">
            <input type="text" id="name" placeholder="আপনার নাম (Full Name)" required class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <input type="email" id="email" placeholder="ইমেইল আইডি (Email)" required class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <input type="password" id="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" required class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <button type="submit" id="submit-btn" class="w-full bg-blue-700 text-white p-2 rounded font-bold hover:bg-blue-800 transition">রেজিস্টার করুন</button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-600" id="switch-text">আগে থেকে অ্যাকাউন্ট থাকলে <a href="login.html" class="text-blue-700 font-bold hover:underline">লগ ইন করুন</a></p>
        <p class="text-center mt-2 text-xs text-gray-500"><a href="index.html" class="hover:underline">← হোমপেজে ফিরে যান</a></p>
        <p id="msg" class="text-center mt-3 text-red-600 font-bold hidden"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChlT0buxHzHEhBjSlbQNEaRezv7oTrZ-I",
            authDomain: "peerfund-69940.firebaseapp.com",
            projectId: "peerfund-69940",
            storageBucket: "peerfund-69940.firebasestorage.app",
            messagingSenderId: "114511100406",
            appId: "1:114511100406:web:9a4d1bc77019a6dafa6fd7",
            measurementId: "G-9NLBGHKMYY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('msg');
            msgBox.classList.add('hidden');

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: email.toLowerCase() === "dhananjoyk7@gmail.com" ? "admin" : "member",
                    totalPaid: 0,
                    joinedAt: new Date().toISOString()
                });

                alert("রেজিস্ট্রেশন সফল হয়েছে! এবার লগ ইন করুন।");
                window.location.href = "login.html"; 
            } catch (error) {
                msgBox.classList.remove('hidden');
                msgBox.innerText = "সমস্যা হয়েছে: " + error.message;
            }
        });

        let lang = 'bn';
        document.getElementById('lang-btn').addEventListener('click', () => {
            lang = lang === 'bn' ? 'en' : 'bn';
            document.getElementById('form-title').innerText = lang === 'bn' ? 'নতুন অ্যাকাউন্ট তৈরি' : 'Create Account';
            document.getElementById('submit-btn').innerText = lang === 'bn' ? 'রেজিস্টার করুন' : 'Register Now';
            document.getElementById('switch-text').innerHTML = lang === 'bn' 
                ? 'আগে থেকে অ্যাকাউন্ট থাকলে <a href="login.html" class="text-blue-700 font-bold hover:underline">লগ ইন করুন</a>'
                : 'Already have an account? <a href="login.html" class="text-blue-700 font-bold hover:underline">Login here</a>';
        });
    </script>
</body>
</html>
