<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile & SOS - Peer Fund</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0A3C2A" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="pb-32">
  <header class="fintech-gradient text-white p-4 shadow-lg sticky top-0 z-30">
    <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
      <h1 class="font-extrabold text-base sm:text-lg truncate" data-i18n="myProfile">আমার প্রোফাইল ও SOS</h1>
      <div class="flex items-center gap-2 shrink-0">
        <button class="lang-toggle-btn px-3 py-1.5 rounded-xl bg-white/15 text-xs font-bold whitespace-nowrap">
          <span class="lang-indicator">EN</span>
        </button>
        <button class="logout-btn px-3 py-1.5 rounded-xl bg-red-500/85 text-xs font-bold whitespace-nowrap" data-i18n="logout">লগ আউট</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-5 space-y-6">
    <div class="fintech-card p-6 flex items-center gap-4">
      <img id="prof-avatar" src="./icon.svg" class="w-16 h-16 sm:w-20 sm:h-20 rounded-3xl object-cover border-2 border-[#39D59E] shadow shrink-0" />
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <h2 id="prof-name-display" class="text-lg sm:text-xl font-extrabold text-[#0A3C2A] break-words">-</h2>
          <span id="prof-role-display" class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-[#0A3C2A] text-[10px] font-extrabold uppercase shrink-0">MEMBER</span>
        </div>
        <p class="text-xs text-gray-500 mt-0.5"><span id="prof-id-display">ID: -</span> • <span id="prof-phone-display">-</span></p>
        <p class="text-xs text-gray-500 truncate" id="prof-email-display">-</p>
      </div>
    </div>

    <div class="fintech-card p-5 border-l-4 border-[#0A3C2A]">
      <h3 class="font-extrabold text-base text-[#0A3C2A]" data-i18n="exitCalcTitle">এক্সিট সেটেলমেন্ট ক্যালকুলেটর</h3>
      <p class="text-xs text-gray-500 mb-4" data-i18n="exitCalcSub">ফান্ড ছাড়তে চাইলে নিট ফেরতযোগ্য টাকার হিসাব</p>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
        <div class="p-3 rounded-2xl bg-emerald-50">
          <p class="text-[11px] text-gray-500">মোট জমা (+)</p>
          <p class="font-extrabold text-sm text-emerald-800" id="exit-paid">₹0</p>
        </div>
        <div class="p-3 rounded-2xl bg-red-50">
          <p class="text-[11px] text-gray-500">বকেয়া লোন (−)</p>
          <p class="font-extrabold text-sm text-red-700" id="exit-loan">₹0</p>
        </div>
        <div class="p-3 rounded-2xl bg-amber-50">
          <p class="text-[11px] text-gray-500">বকেয়া ফাইন (−)</p>
          <p class="font-extrabold text-sm text-amber-800" id="exit-fine">₹0</p>
        </div>
        <div class="p-3 rounded-2xl fintech-gradient text-white">
          <p class="text-[11px] text-[#5CDDAB]">নিট ফেরতযোগ্য (=)</p>
          <p class="font-extrabold text-base text-white" id="exit-net">₹0</p>
        </div>
      </div>
    </div>

    <div class="fintech-card p-6">
      <h3 class="font-extrabold text-base text-[#0A3C2A] mb-4" data-i18n="editProfile">প্রোফাইল এডিট ও সেভ করুন</h3>

      <form id="profile-edit-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">প্রোফাইল পিকচার আপলোড / Profile Picture</label>
          <input type="file" id="edit-photo" accept="image/*"
            class="w-full text-xs text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-100 file:text-[#0A3C2A] file:font-bold" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">পূর্ণ নাম / Full Name *</label>
            <input type="text" id="edit-name" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">ব্লাড গ্রুপ / Blood Group</label>
            <select id="edit-blood" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm bg-white">
              <option value="">নির্বাচন করুন / Select</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">আপনার UPI ID (পেমেন্ট পাওয়ার জন্য)</label>
            <input type="text" id="edit-upi" placeholder="yourname@okaxis" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">ফ্যামিলি ইমার্জেন্সি SOS নম্বর</label>
            <input type="tel" id="edit-sos" placeholder="বাড়ির কারোর মোবাইল নম্বর" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">ব্যাঙ্ক অ্যাকাউন্ট নম্বর (সুরক্ষিত ও ব্যক্তিগত)</label>
            <input type="text" id="edit-bank" placeholder="Account Number (Private)" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm" />
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">IFSC কোড</label>
            <input type="text" id="edit-ifsc" placeholder="SBIN0001234" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm uppercase" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-gray-700 mb-1">নমিনি নাম ও সম্পর্ক / Nominee Name & Relation</label>
            <input type="text" id="edit-nominee" placeholder="যেমন: Rina Karmakar (Wife / Mother)" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm" />
          </div>
        </div>

        <button type="submit" id="save-profile-btn" class="w-full mint-btn py-3 rounded-xl text-sm">
          প্রোফাইল সেভ করুন / Save Profile
        </button>
      </form>
    </div>
  </main>

  <!-- High-Contrast Crisp SVG Bottom Navigation Bar -->
  <nav id="bottom-nav" class="fixed bottom-3 left-3 right-3 max-w-md mx-auto bottom-nav-pill text-white rounded-2xl px-2 py-2 z-40 border border-white/15">
    <div class="grid grid-cols-4 gap-1 text-center text-[11px] leading-none">
      <a href="dashboard.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-1 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navHome">হোম</span>
      </a>
      <a href="ledger.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-1 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 7h6m-6 4h4"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLedger">হিসাব</span>
      </a>
      <a href="loans.html" class="text-white hover:text-[#5CDDAB] font-medium py-1.5 px-1 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navLoans">লোন</span>
      </a>
      <a href="profile.html" class="text-[#5CDDAB] font-extrabold bg-[#5CDDAB]/15 rounded-xl py-1.5 px-1 flex flex-col items-center justify-center gap-1 transition">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="whitespace-nowrap" data-i18n="navProfile">প্রোফাইল</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import {
      doc,
      updateDoc,
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      requireApprovedUser,
      setupCommonUI,
      formatINR,
      getCurrentMonthKey,
      isAfterFifthOfMonth,
      compressImageToBase64,
      logAudit
    } from "./js/utils.js";
    import "./js/i18n.js";

    setupCommonUI();

    requireApprovedUser((user, me) => {
      document.getElementById("prof-name-display").textContent = me.name;
      document.getElementById("prof-role-display").textContent = me.role.toUpperCase();
      document.getElementById("prof-id-display").textContent = `ID: ${me.memberId || "-"}`;
      document.getElementById("prof-phone-display").textContent = me.phone;
      document.getElementById("prof-email-display").textContent = me.email;
      if (me.photoBase64) document.getElementById("prof-avatar").src = me.photoBase64;

      document.getElementById("edit-name").value = me.name || "";
      document.getElementById("edit-blood").value = me.bloodGroup || "";
      document.getElementById("edit-upi").value = me.upiId || "";
      document.getElementById("edit-sos").value = me.sosContact || "";
      document.getElementById("edit-bank").value = me.bankAccount || "";
      document.getElementById("edit-ifsc").value = me.ifsc || "";
      document.getElementById("edit-nominee").value = me.nominee || "";

      onSnapshot(collection(db, "loans"), (snap) => {
        let activeLoanDue = 0;
        snap.forEach((d) => {
          const l = d.data();
          if (l.uid === me.uid && l.status === "approved") {
            activeLoanDue += Math.max(0, Number(l.amount || 0) - Number(l.repaidAmount || 0));
          }
        });

        const totalPaid = Number(me.totalPaid || 0);
        const autoOverdueFine = (me.lastPaidMonth !== getCurrentMonthKey() && isAfterFifthOfMonth()) ? 100 : 0;
        const pendingFine = Math.max(Number(me.pendingFine || 0), autoOverdueFine);
        const netRefund = totalPaid - activeLoanDue - pendingFine;

        document.getElementById("exit-paid").textContent = formatINR(totalPaid);
        document.getElementById("exit-loan").textContent = formatINR(activeLoanDue);
        document.getElementById("exit-fine").textContent = formatINR(pendingFine);
        document.getElementById("exit-net").textContent = formatINR(netRefund);
      });

      document.getElementById("profile-edit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("save-profile-btn");
        btn.disabled = true;
        btn.textContent = "সেভ হচ্ছে...";

        try {
          const updates = {
            name: document.getElementById("edit-name").value.trim(),
            bloodGroup: document.getElementById("edit-blood").value,
            upiId: document.getElementById("edit-upi").value.trim(),
            sosContact: document.getElementById("edit-sos").value.trim(),
            bankAccount: document.getElementById("edit-bank").value.trim(),
            ifsc: document.getElementById("edit-ifsc").value.trim().toUpperCase(),
            nominee: document.getElementById("edit-nominee").value.trim()
          };

          const photoFile = document.getElementById("edit-photo").files[0];
          if (photoFile) {
            const compressed = await compressImageToBase64(photoFile, 240, 0.75);
            updates.photoBase64 = compressed;
            document.getElementById("prof-avatar").src = compressed;
          }

          await updateDoc(doc(db, "users", me.uid), updates);
          document.getElementById("prof-name-display").textContent = updates.name;

          await logAudit({
            actionType: "PROFILE_UPDATED",
            messageBn: `${updates.name} নিজের প্রোফাইল ও SOS তথ্য আপডেট করেছেন।`,
            messageEn: `${updates.name} updated their profile & SOS details.`,
            actorUid: me.uid,
            actorName: updates.name,
            actorRole: me.role
          });

          alert("প্রোফাইল সফলভাবে আপডেট হয়েছে / Profile updated!");
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "প্রোফাইল সেভ করুন / Save Profile";
        }
      });
    });
  </script>
</body>
</html>
